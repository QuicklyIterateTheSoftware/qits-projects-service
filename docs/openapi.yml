      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseRequestCommitsDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Release Request Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
  /projects/api/repositories/{repoId}/release-requests/{requestId}/decline:
    post:
      summary: "Refuse this request's current fold, answerably"
      description: "The request is REJECTED carrying the decider's own sentence as\
        \ its detail. This is NOT a withdrawal and the two must not be read as degrees\
        \ of the same thing: a decline judges CONTENT and is answerable by a new fold\
        \ — push a fix onto a participating branch, the request re-folds, the decision\
        \ no longer names the fold it is on, and it is pending both gates again —\
        \ while withdraw judges the ASK, is terminal, frees the branches and makes\
        \ the next release ask mint a fresh request. Same body and same refusals as\
        \ approve, mergedSha included. No unattended-gate ticket is filed: a person\
        \ just said no, so somebody is watching by definition. A person only, verified\
        \ exactly as approve verifies one — qits:admin-agent admitted too on the same\
        \ terms as approve (qits-628 follow-up)."
      operationId: declineReleaseRequest
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineReleaseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response19"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      tags:
      - Release Request Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /projects/api/repositories/{repoId}/release-requests/{requestId}/pipeline/{phase}/rerun:
    post:
      summary: Run one phase of this release again
      description: "phase is QA, PUBLISH or DEPLOY — the three phases of a release\
        \ pipeline. QA and PUBLISH ask qits-ci to re-fire that phase's run; DEPLOY\
        \ re-posts the release onto qits-deployments, which is the door a redeploy\
        \ has always gone through. Nothing about the request changes: no state moves,\
        \ no gate is re-decided and no event is published here — the new run reports\
        \ on the bus exactly as the first one did, so the answer is the request as\
        \ it stands and the result arrives later. 409 carries qits-ci's OWN sentence\
        \ where it refuses, because that sentence is the fact worth having: that the\
        \ phase's newest run succeeded and its verdict is spent, that the phase has\
        \ never run, or that it is running right now. DEPLOY is a 409 for a request\
        \ that has not released (no version, so nothing to deploy) and for a repository\
        \ that declares no deployment at all. 404 for an unknown request or one that\
        \ is not this repository's, 400 for a word naming no phase, 503 where the\
        \ sibling service is not configured."
      operationId: rerunReleasePipelinePhase
      parameters:
      - name: phase
        in: path
        required: true
        schema:
          type: string
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response16"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Release Request Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
  /projects/api/repositories/{repoId}/release-requests/{requestId}/sources:
    post:
      summary: Add a branch to an open release request
      description: "The request is re-folded with the new source and, if the fold\
        \ produces a new commit, the gates are re-armed onto it. Idempotent: a branch\
        \ already on the request answers the request unchanged. A RELEASED or WITHDRAWN\
        \ request answers 409. Implicit tag sources are not addable — they are derived\
        \ from what the repository has in flight."
      operationId: addReleaseRequestSource
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddReleaseRequestSource"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response23"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      tags:
      - Release Request Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
  /projects/api/repositories/{repoId}/release-requests/{requestId}/sources/priority:
    post:
      summary: Re-state how urgently one of a request's branches wants to be released
      description: "Priority is per participating branch and the request answers with\
        \ the max over them, so raising one branch raises the request. Nothing is\
        \ re-folded and no event is published: the same branches are folded onto the\
        \ same backing branch, so the sha the gates are evaluating has not moved.\
        \ The value reaches the platform with the release itself, which reads the\
        \ sources live. A branch the request does not name is a 404, a word naming\
        \ no priority is a 400, and a RELEASED or WITHDRAWN request is a 409. Implicit\
        \ tag sources carry no priority and cannot be addressed here."
      operationId: setReleaseSourcePriority
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetReleaseSourcePriority"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response15"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      tags:
      - Release Request Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
  /projects/api/repositories/{repoId}/release-requests/{requestId}/withdraw:
    post:
      summary: Withdraw an open release request
      description: "The ask is moot — nothing should land this branch. WITHDRAWN is\
        \ terminal and frees the branch: the next release ask mints a fresh request.\
        \ A request already RELEASED or WITHDRAWN answers 409. A deleted branch withdraws\
        \ its open request automatically; this route is the operator's spelling for\
        \ every other reason."
      operationId: withdrawReleaseRequest
      parameters:
      - name: repoId
        in: path
