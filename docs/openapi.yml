        - qits:admin-agent
  /projects/api/projects/{projectId}/repositories/by-name/{repoName}:
    get:
      summary: Resolve a project-scoped repository name to its id
      description: "The name is the segment a committed relative submodule url (../<name>.git)\
        \ resolves to, with any .git suffix stripped. Resolution is exactly what wrapper\
        \ membership honours: the (project, name) alias, and nothing else. The projectId\
        \ segment is the project's id OR its slug — the slug is the public spelling\
        \ of a clone url (/git/qits/qits-ci) and the id is matched first, so both\
        \ always resolve. The id answered is the opaque storage key this service and\
        \ qits-githost share, not a name."
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: repoName
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The name resolves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response1"
        "404":
          description: "No such project, or no repository by that name"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Project Controller
      security:
      - SecurityScheme:
        - qits:system
        - qits:agent
  /projects/api/projects/{projectId}/repositories/reconcile:
    post:
      summary: Bring a project's repositories in line with its wrapper's .gitmodules
      description: "The wrapper repository is the project's configuration: every submodule\
        \ entry gets a repository (adopted when the git host already serves it, cloned\
        \ from the entry's backend otherwise), an entry's path (components/<component>/<name>)\
        \ says which component it belongs to while its name says what kind of thing\
        \ it is, and a repository no entry names is reported UNDECLARED and left alone.\
        \ This never deletes: a deleted repository loses its history on the git host,\
        \ so the answer names the strays and a person decides. Idempotent, and the\
        \ way a project imported from a wrapper url is materialized."
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The reconcile ran. A per-entry failure is still a 200 — the
            outcomes are the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response2"
        "400":
          description: The project has no wrapper repository
        "404":
          description: No such project
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Project Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /projects/api/projects/{project}/work:
    get:
      summary: List a project's work of every archetype
      description: "The project's whole planning tree, flat: each root oldest first,\
        \ its descendants depth-first in position order. Optionally narrowed to one\
        \ archetype, one status, and the direct children of one parent (qualified\
        \ id or UUID). The project is its id or its slug."
      operationId: listProjectWork
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: archetype
        in: query
        schema:
          type: string
      - name: parent
