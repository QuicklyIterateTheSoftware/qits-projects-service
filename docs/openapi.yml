    get:
      summary: Every repository with its public coordinates
      description: "The machine-readable catalogue: row id, project, addressable name,\
        \ main branch and archetype, sorted by project then name. A repository that\
        \ owns no name is listed with a null name; one whose name declares no role\
        \ suffix carries a null archetype."
