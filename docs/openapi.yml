        \ commit at all) and never merge-base(mergedSha, main), which reports nothing\
        \ once the release reaches main. base and baseTag name what was used; a repository\
        \ that has never released is diffed against the empty tree. An empty list\
        \ is never an error — detail says whether nothing has been folded yet, the\
