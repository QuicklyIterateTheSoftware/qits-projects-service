  /projects/api/projects/{projectId}/reconcile:
    post:
      summary: Re-assert a project's domain through the dns registrar
      description: "Project creation registers the dns record fire-and-forget, so\
        \ a receiver that was down when a project was created leaves the record missing\
        \ with nothing to carry it forward. This re-asserts it synchronously and reports\
        \ the outcome; the receiver is idempotent, so it is safe to repeat, and it\
        \ is also how a project created before the hook existed gets its record. No\
        \ registrar is wired at present, so the outcome is FAILED saying so and dns\
        \ records are configured by hand at the external provider."
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The reconcile ran. A failed re-assertion is still a 200 — the
            outcome is the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response3"
        "404":
          description: No such project
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Project Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
