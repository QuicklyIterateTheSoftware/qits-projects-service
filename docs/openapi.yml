  /projects/api/repositories/{repoId}/release-requests/{requestId}/changes/submodule/diff:
    get:
      summary: The patch of one file inside a submodule this request's fold moves
      description: "The unified diff of file within the submodule at path, taken in\
        \ the SIBLING repository between the two pins this fold moves between — the\
        \ patch …/changes/submodule lists as a changed file. Same resolution and same\
        \ authorisation as that read: path selects a gitlink of this fold and file\
        \ selects a path inside it, so the pair cannot reach a repository the fold\
        \ does not pin. An empty diff is never an error — a binary file, a pure rename,\
        \ a chain that stopped for any of the reasons …/changes/submodule reports\
        \ in detail, and a patch over ~1 MiB all answer their change type with no\
        \ text."
      operationId: getReleaseRequestSubmoduleChangeDiff
