      - Work Members Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/members/{membershipId}:
    delete:
      summary: Remove a membership from its campaign
      description: "Refused once the member was claimed, and while another member's\
        \ criterion targets it. Answers the members that remain."
      operationId: removeWorkMember
      parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The members that remain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkMemberList"
        "403":
          description: An agent outside its own project
        "404":
          description: "No campaign, or no such membership on it"
        "409":
          description: "Claimed, or targeted by another member"
        "401":
          description: Not Authorized
      tags:
      - Work Members Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/members/{membershipId}/condition:
    put:
      summary: Replace a membership's condition
      description: "PUT semantics: the whole condition, groups OR'd and criteria in\
        \ a group AND'd; an empty list waits on nothing. A criterion restating an\
        \ existing id keeps its latch. An ENTITY_STATUS predicate's entityId takes\
        \ a qualified id or a UUID."
      operationId: setWorkMemberCondition
      parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkMemberCondition"
        required: true
      responses:
        "200":
          description: The member with its condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkMemberAnswer"
        "400":
          description: A criterion the service cannot read
        "403":
          description: An agent outside its own project
        "404":
          description: "No campaign, or no such membership on it"
        "401":
          description: Not Authorized
      tags:
      - Work Members Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/members/{membershipId}/criteria/{criterionId}/approve:
    post:
      summary: A person's yes on a member's APPROVAL criterion
      description: "qits:admin, and then a person this service verified itself; the\
        \ name recorded is the proof's. Refused when the criterion is not APPROVAL,\
        \ is already satisfied, or the campaign is DONE or DROPPED."
      operationId: approveWorkMemberCriterion
      parameters:
      - name: criterionId
        in: path
        required: true
        schema:
          type: string
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCriterionApproval"
        required: true
      responses:
        "200":
          description: The member with the criterion satisfied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkMemberAnswer"
        "403":
          description: Not a verified person
        "404":
          description: "No campaign, membership or criterion"
        "409":
          description: "Not an APPROVAL, already satisfied, or closed"
        "401":
          description: Not Authorized
        "400":
          description: Bad Request
      tags:
      - Work Members Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /projects/api/work/{qualifiedId}/members/{membershipId}/position:
    put:
      summary: Move a membership within its campaign
      description: Answers the members as the move left them.
      operationId: moveWorkMember
      parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkMemberMove"
        required: true
      responses:
        "200":
          description: "The members, in their new order"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkMemberList"
        "403":
          description: An agent outside its own project
        "404":
          description: "No campaign, or no such membership on it"
        "401":
          description: Not Authorized
        "400":
          description: Bad Request
      tags:
      - Work Members Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/progress:
    get:
      summary: How a campaign is doing
      description: "Every member's derived state, what it waits for, each criterion\
        \ judged (the sentence that would latch it, whether it still can, its evidence),\
        \ and whether the criteria evaluator is listening. The path names the campaign\
        \ by qualified id (<projectSlug>-<n>) or UUID."
      operationId: getWorkProgress
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkProgressAnswer"
        "404":
          description: No campaign with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Progress Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/refinement:
    post:
      summary: Open (or find) a work entity's refinement room
      description: "Find-or-create: an entity has at most one room, and a second open\
        \ answers the first. Refused for a feature or a task, an entity not at REPORTED,\
        \ one an ACTIVE workspace names, and a project with no wrapper. The path names\
        \ the entity by qualified id (<projectSlug>-<n>) or UUID."
      operationId: startWorkRefinement
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkRefinementAnswer"
        "404":
          description: No entity with this id
        "409":
          description: The entity cannot be refined now
        "502":
          description: The git host would not cut the branch
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Refinement Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
    get:
      summary: Find a work entity's refinement room
      description: "The entity's room, or null when it has none; never creates one.\
        \ The path names the entity by qualified id or UUID."
      operationId: getWorkRefinement
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The room, or null"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkRefinementAnswer"
        "404":
          description: No entity with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Refinement Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/status:
    post:
      summary: Move a work entity through its lifecycle
      description: "Moves an epic, ticket, campaign, feature or task to the target\
        \ status, by the same path as the archetype's own transition and under its\
        \ roles: an agent may move a ticket, a campaign, a feature or a task of its\
        \ own project, a platform service (qits:system) one of any project, and an\
        \ epic is qits:admin alone. A feature or a task moves only once its epic is\
        \ past REPORTED, and its scheduling (to READY_FOR_DEV, or back) is the epic's.\
        \ Answers the entity in the merged shape, with statusBefore."
      operationId: setWorkStatus
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkStatusMove"
        required: true
      responses:
        "200":
          description: The entity as the move left it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionedEntity"
        "400":
          description: No target
        "403":
          description: "An agent moving an epic, or an entity outside its own project;\
            \ nothing is written"
        "404":
          description: No entity with this id
        "409":
          description: "A move the lifecycle does not allow, a target naming no status,\
            \ a feature or a task whose epic is still REPORTED, or a quality gate\
            \ refusing a forward move — ACCEPTANCE_CRITERIA, or PERSON_APPROVAL for\
            \ REFINED to READY_FOR_DEV by a caller this service did not verify as\
            \ a person"
        "401":
          description: Not Authorized
      tags:
      - Work Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
        - qits:system
  /projects/api/work/{qualifiedId}/workspaces:
    get:
      summary: The workspaces naming a work entity
      description: "Every workspace a dispatch stood on the entity's branch, live\
        \ and resolved alike, each with its status; empty when qits-workspaces cannot\
        \ be asked. The path names the entity by qualified id (<projectSlug>-<n>)\
        \ or UUID."
      operationId: listWorkWorkspaces
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkWorkspaces"
        "404":
          description: No entity with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Workspaces Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
info:
  title: qits-projects API
  version: 2026.1009.114320
