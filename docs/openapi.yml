  /projects/api/repositories/{repoId}/release-requests/{requestId}/changes/submodule:
    get:
      summary: "One submodule this request's fold moves, expanded into its own history"
      description: "A wrapper's release is almost entirely 160000 gitlinks, and the\
        \ fold's own patch for one is a pair of opaque Subproject commit lines. This\
        \ answers what the release actually does: the sibling repository the path\
        \ resolves to through the fold's own .gitmodules, the two pins, and that repository's\
        \ commits and changed files between them. path addresses a gitlink of THIS\
        \ fold and there is no repository parameter — the fold is re-diffed at that\
        \ one path and must report a 160000-to-160000 modification, so the only repositories\
        \ reachable here are the ones the request under review pins. Nothing is ever\
        \ an error: nothing folded yet, a fold the repository no longer holds, a path\
        \ the fold does not move, a path the manifest does not declare, a name no\
        \ repository of this project answers to, a pin the sibling does not contain\
        \ and a sibling that could not be read all answer 200 with the reason in detail.\
        \ An added or removed gitlink names its one pin and is not expandable. Over\
        \ 2000 paths the file list is capped with truncated set."
      operationId: getReleaseRequestSubmoduleChanges
