        \ is what says which fold it was about; compare it against the request's current\
        \ mergedSha to see which entry still counts (at most one does, the newest\
        \ at that sha). Rows are never edited and never deleted, so a change of mind\
        \ is a further entry rather than a correction. An empty list is the ordinary\
        \ answer for a request nobody has decided on and for one whose repository\
