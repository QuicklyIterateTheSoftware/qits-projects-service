        \ REJECTED, FAILED, CONFLICTED, WITHDRAWN) to narrow to one."
      operationId: listRepositoryReleaseRequests
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response17"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Release Request Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
    post:
      summary: Ask for a branch to be released once its builds are green
      description: "Creates (or converges on) the repository's one open release request.\
        \ A fresh request's sources are main plus the named branch, plus every released\
        \ tag of the repository not yet merged to main; they are folded onto release/<id>\
        \ and it is that MERGE the gates evaluate — mergedSha on the answer. A repository\
        \ has at most one unreleased request, whatever its archetype: a branch that\
        \ already participates answers that request, and a branch nothing has asked\
        \ about JOINS it as a further source, so the answer may carry an id you did\
        \ not create, sources you did not name and somebody else's summary. Only when\
        \ your branch is the request's sole asked-for source do your summary and requester\
        \ replace the request's; otherwise the words of the ask that opened it stand,\
        \ and yours are recorded on your own source row. Poll until RELEASED, REJECTED,\
        \ CONFLICTED or FAILED; detail says why, and conflict says what to resolve."
      operationId: createReleaseRequest
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response20"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      tags:
      - Release Request Controller
      security:
