    WorkPatch:
      type: object
      description: "A JSON merge patch (RFC 7396) of one work entity. An absent property\
        \ is left as it is; an explicit null clears it. At least one property must\
        \ be named. status, archetype, membership, supersededBy and blocked are refused\
        \ with the door that moves them; slug and createdBy are server-owned; any\
        \ other property is refused as unknown. A property the entity's archetype\
        \ has no slot for is refused (impetus on an epic)."
      properties:
        title:
          type: string
          description: The label. Cannot be cleared.
        description:
          type:
          - string
          - "null"
          description: The long-form Markdown body; null clears it.
        impetus:
          type:
          - string
          - "null"
          description: A ticket's impetus; null clears it.
        ticketType:
          type: string
          description: "A ticket's type, BUG or IMPROVEMENT; MAINTENANCE marks a ticket\
            \ the platform filed and will close itself, and retyping one away from\
            \ it takes it over. Cannot be cleared."
        assignee:
          type:
          - string
          - "null"
          description: An epic's or a ticket's assignee; null clears it.
        repositoryId:
          type: string
          description: "A task's repository, in the task's project. Cannot be cleared."
        dependsOn:
          type:
          - string
          - "null"
          description: "A feature's or task's sibling dependency, by qualified id\
            \ or UUID; null clears it."
        implementedAt:
          type:
          - string
          - "null"
          description: A feature's or task's implemented marker (ISO-8601 instant);
            null clears it. Moves only while the owning epic is READY_FOR_DEV or IMPLEMENTING.
            Setting it moves the item's status to IMPLEMENTED; clearing it takes an
            IMPLEMENTED item back to IMPLEMENTING (or READY_FOR_DEV when it was never
            marked implementing).
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        implementingAt:
          $ref: "#/components/schemas/Instant"
          type: string
          description: "A feature's or task's implementing marker (ISO-8601 instant):\
            \ when its implementation was started. Cannot be cleared. Moves only while\
            \ the owning epic is READY_FOR_DEV or IMPLEMENTING, and moves the item's\
            \ status to IMPLEMENTING when it is not already there or further."
        acceptanceCriteria:
          type:
          - array
          - "null"
          items:
            type: string
          description: "An epic's or ticket's acceptance criteria, the whole list\
            \ in order; null or an empty list clears them. Each item is one line of\
            \ Markdown: not blank, no line break, at most one '.', and fewer than\
            \ 20 whitespace characters. Editable at REFINED (outside an epic's scope\
            \ freeze); from READY_FOR_DEV on a changed list is a 409, and restating\
            \ the same list passes."
    WorkProgressAnswer:
      type: object
      description: "A campaign's progress, derived on the read."
      properties:
        progress:
          $ref: "#/components/schemas/CampaignProgressDto"
    WorkRefinementAnswer:
      type: object
      description: A work entity's refinement room; null on a read that found none.
      properties:
        refinement:
