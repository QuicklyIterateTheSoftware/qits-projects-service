        - qits:agent
  /projects/api/repositories/{repoId}/release-requests/{requestId}/commits:
    get:
      summary: The commits this request's fold brought in
      description: "The fold minus every release tag that does not contain it — main\
        \ only ever advances by merging released tags, so what is left is exactly\
        \ what the request's sources contributed over what was already shipped. It\
        \ stays the same answer after the release reaches main, which neither mergedSha^1\
        \ nor a live read of main does. The version bump is not in the list: the release\
        \ commits the rewritten manifests ON TOP of the fold. An empty list is never\
        \ an error — detail says whether nothing has been folded yet, the fold is\
        \ no longer in the repository's history, or the fold genuinely added nothing."
      operationId: listReleaseRequestCommits
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
