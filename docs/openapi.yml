        - qits:system
        - qits:agent
  /projects/api/repositories/{repoId}:
    patch:
      summary: Rename a repository
      description: "Gives the repository a new project-scoped addressable name. Nothing\
        \ moves on the git host — a bare is keyed by the repository's id — so /git/<project>/<newName>\
        \ serves it immediately and the old name stops resolving. The archetype is\
        \ re-derived from the new name's role suffix (-service, -daemon, -frontend,\
        \ -cli, -oci, -javalib, -jslib) and left as it was when the new name declares\
        \ none. The project's wrapper is NOT rewritten: update the .gitmodules entry\
        \ to the new name and push, or the repository reads as UNDECLARED until you\
        \ do. The backup twin self-heals from the wrapper on the next reconcile."
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRepositoryRequest"
        required: true
      responses:
        "200":
          description: The repository answers to the new name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response26"
        "400":
          description: "An invalid name, a name another repository in this project\
            \ already answers to, or the project's wrapper repository (whose name\
            \ is derived from the immutable slug)"
        "404":
          description: No such repository
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Repository Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
    get:
      operationId: getRepository
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response30"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get
      tags:
      - Repository Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
    delete:
      summary: "Delete a repository, on the git host as well"
      description: "Deletes the row, the repository's workspaces, its local mirror,\
        \ its entry in the project's wrapper if it is still there, and the repository\
        \ itself on qits-githost. The history is gone: there is no tombstone and no\
        \ retention, and a git host that fails the delete fails the whole request,\
        \ leaving the row. The project's wrapper repository is refused — delete the\
        \ project instead."
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response32"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Repository Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /projects/api/repositories/{repoId}/active-process:
    get:
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response36"
        "401":
          description: Not Authorized
