  /projects/api/repositories/{repoId}/release-requests/{requestId}/approve:
    post:
      summary: "Sign off this request's current fold, so it may release"
      description: "The person's half of the second gate: where the repository's releases\
        \ have to be approved — today the project wrapper — a request that has passed\
        \ every build gate still waits for this. mergedSha is required and names the\
        \ fold being approved; a stale one answers 409 naming the fold the request\
        \ is on now, because an approval is a statement about content and a push may\
        \ have landed while the page was open. The gate is re-asked immediately, so\
        \ a fold whose build is already green releases on the click. 409 also for\
        \ a request that has concluded or is already being released, for one with\
        \ no fold yet, and for a repository that needs no approval at all — approving\
        \ what has no gate is a caller error, not a no-op. A person only: qits:admin,\
        \ verified by this service from a browser session or a person's qits CLI token\
        \ — asserted identity headers alone answer 403. A machine may ask for a release\
        \ and withdraw one, and may not sign off the estate. qits:admin-agent is admitted\
        \ too (qits-628 follow-up); remove it here if this door must stay human-only\
        \ — the verification below still refuses a commissioned bearer today."
