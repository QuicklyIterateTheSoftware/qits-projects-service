    WorkStatusMove:
      type: object
      required:
      - target
      description: "A lifecycle move: the status to move to."
      properties:
        target:
          type: string
          description: "REPORTED, REFINED, READY_FOR_DEV, IMPLEMENTING, IMPLEMENTED,\
            \ VERIFYING, VERIFIED, DONE or DROPPED — one the entity's current status\
            \ may move to: a neighbour on the walk (IMPLEMENTING has no move back,\
            \ and READY_FOR_DEV none to REPORTED), or IMPLEMENTED from READY_FOR_DEV\
            \ or VERIFIED from IMPLEMENTED (the skips). A campaign never moves to\
            \ IMPLEMENTING or VERIFYING."
    WorkWorkspaces:
