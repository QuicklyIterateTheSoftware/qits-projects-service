      description: "The unified diff of path, against the same base …/changes lists:\
        \ the newest release tag that does not contain the fold, resolved with merge-base,\
        \ or the empty tree for a repository that has never released. An empty diff\
        \ is never an error — a binary file, a pure rename, a fold that is not there\
