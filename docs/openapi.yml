  /projects/api/work:
    post:
      summary: Create a work entity of any archetype
      description: "Files a new epic, ticket, campaign, feature or task from one body\
        \ shape: the archetype plus the archetype's create schema (GET /projects/api/work/archetypes/{archetype}/schemas/create).\
        \ A root names its project (id or slug), a node its parent (qualified id or\
        \ UUID): a feature's parent is an EPIC, a task's a FEATURE. A dependency is\
        \ a qualified id or a UUID. The status starts REPORTED. Answers the entity\
        \ in the merged shape, with its qualified id."
      operationId: createWork
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCreate"
        required: true
      responses:
        "201":
          description: The entity as written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionedEntity"
        "400":
          description: "Every complaint about the body in one message: not an object,\
            \ no or an unknown archetype, a property the create schema does not list,\
            \ a missing required one, a value of the wrong shape, a parent of the\
            \ wrong kind, or a repository outside the project"
        "403":
          description: An agent creating in a project other than its own; nothing
            is written
        "404":
          description: "The project, the parent or the repository names nothing"
        "409":
          description: "The owning epic's status freezes its scope: a node needs the\
            \ epic REPORTED"
        "401":
          description: Not Authorized
      tags:
      - Work Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
        - qits:system
  /projects/api/work/archetypes:
    get:
      summary: "The archetype registry: properties, lifecycles, legal moves and dispatch\
        \ phases"
      description: "Every archetype's declaration, read off the registry and the state\
        \ machine the doors enforce: what it requires and permits, its lifecycle,\
        \ the legal moves out of each status (transitions, each naming the quality\
        \ gates it has to pass) and what a dispatch press runs from each status (phases)."
      operationId: listWorkArchetypes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchetypeRegistryDocument"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Archetypes Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/archetypes/{archetype}/schemas/{door}:
    get:
      summary: "The JSON Schema of a work write door's payload, per archetype"
      description: "A JSON Schema (2020-12) object for the body of one write door\
        \ and one archetype: create (POST /projects/api/work, less the archetype),\
        \ update (the merge patch of PATCH /projects/api/work/{qualifiedId}) or transition\
        \ (the body of PUT /projects/api/work/{qualifiedId}, one entry of POST /projects/api/work/transition).\
        \ Built from the archetype registry and the same property table the doors\
        \ validate with. The archetype is case-insensitive."
      operationId: getWorkArchetypeSchema
      parameters:
      - name: archetype
        in: path
        required: true
        schema:
          type: string
      - name: door
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The schema
          content:
            application/json:
              schema:
                type: object
        "404":
          description: "No such archetype, or no such door"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Archetypes Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/transition:
    post:
      summary: "State several work entities in full, as one post-state"
      description: "A map of entity id to the whole state that entity is to have afterwards,\
        \ validated as one post-state, applied in one transaction and announced once.\
        \ The keys and every id in an entry (membership.parent, supersededBy, dependsOn)\
        \ are qualified ids or UUIDs; an id naming nothing is one of the violations\
        \ in the 400. Answers each entity in the merged shape, keyed as the request\
        \ was."
      operationId: transitionWork
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/EntityTransition"
        required: true
      responses:
        "200":
          description: "What was written, keyed as the request was"
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/TransitionedEntity"
        "400":
          description: "Every violation of the stated post-state, in one message"
        "403":
          description: An agent whose batch reaches outside its own project; nothing
            of it is written
        "409":
          description: "A status this door may not state, or a changed acceptance-criteria\
            \ list from READY_FOR_DEV on"
        "401":
          description: Not Authorized
      tags:
      - Work Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}:
    put:
      summary: State a work entity in full
      description: "The full edit of one entity: the body is the entity's whole state\
        \ afterwards — what it is (archetype), where it hangs (membership), every\
        \ property — and an absent property is cleared, not left alone. It is the\
        \ one-entry form of POST /projects/api/work/transition and obeys every rule\
        \ of it, so it is also how a single entity is reshaped, reparented or superseded.\
        \ Every entity id in the body (membership.parent, supersededBy, dependsOn)\
        \ is a qualified id or a UUID. Answers the entity as written, in the merged\
        \ shape."
      operationId: putWork
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityTransition"
        required: true
      responses:
        "200":
          description: The entity as written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionedEntity"
        "400":
          description: "Every violation of the stated state, in one message"
        "403":
          description: An agent writing outside its own project; nothing is written
        "404":
          description: No entity with this id
        "409":
          description: "A status this door may not state (a change to or from READY_FOR_DEV,\
            \ a jump into started work, a gated move — those go through POST /work/{qualifiedId}/status),\
            \ or a changed acceptance-criteria list from READY_FOR_DEV on"
        "401":
          description: Not Authorized
      tags:
      - Work Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    patch:
      summary: Edit a work entity's fields (JSON merge patch)
      description: "Partial update of one entity of any archetype. An absent property\
        \ is left unchanged and an explicit null clears it. The status is never written\
        \ here — a lifecycle move goes through POST /projects/api/work/{qualifiedId}/status,\
        \ and a reshape, reparent or supersede through PUT /projects/api/work/{qualifiedId}\
        \ or POST /projects/api/work/transition. dependsOn is a qualified id or a\
        \ UUID. An epic's, feature's or task's scope follows the epic's freeze: scope\
        \ edits need the epic REPORTED, the markers need it READY_FOR_DEV or IMPLEMENTING,\
        \ and a marker moves the item's status with it. An epic's or a ticket's acceptance\
        \ criteria are frozen from READY_FOR_DEV on, where a changed list is refused\
        \ and the same list restated passes. Answers the entity in the merged shape."
      operationId: patchWork
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/WorkPatch"
          application/json:
            schema:
              $ref: "#/components/schemas/WorkPatch"
        required: true
      responses:
        "200":
          description: The entity as it stands after the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionedEntity"
        "400":
          description: "Every complaint about the body in one message: not an object,\
            \ empty, a property that is a move or server-owned or unknown, one the\
            \ archetype has no slot for, a null where the property cannot be cleared,\
            \ or a value of the wrong shape"
        "403":
          description: An agent writing an entity outside its own project; nothing
            is written
        "404":
          description: No entity with this id
        "409":
          description: "The owning epic's status freezes what the patch touches, or\
            \ the acceptance criteria are changed from READY_FOR_DEV on"
        "401":
          description: Not Authorized
      tags:
      - Work Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
        - qits:system
    get:
      summary: Read one work entity of any archetype
      description: "The entity in the merged shape, with its qualified id, its parent\
        \ and position, and whether it is blocked. The path names it by qualified\
        \ id (<projectSlug>-<n>) or UUID."
      operationId: getWork
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionedEntity"
        "404":
          description: No entity with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
        - qits:system
    delete:
      summary: Delete a work entity and its subtree
      description: "Removes the entity, its descendants and their threads, each audited;\
        \ the audit log outlives them. An epic's or a ticket's delete is qits:admin\
        \ alone; a feature's or a task's admits an agent bound to its project and\
        \ obeys its epic's freeze. A campaign is not deleted but dropped. The path\
        \ names the entity by qualified id (<projectSlug>-<n>) or UUID."
      operationId: deleteWork
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The entity is gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDeleted"
        "403":
          description: "An agent deleting an epic or a ticket, or outside its own\
            \ project"
        "404":
          description: No entity with this id
        "409":
          description: "A campaign, or a feature or a task whose epic is no longer\
            \ REPORTED"
        "401":
          description: Not Authorized
      tags:
      - Work Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/agent-waiting:
    post:
      summary: Report whether the agent session on a work entity is waiting for a
        person
      description: "A session that stays waiting past the debounce makes the entity\
        \ read as blocked (blockSource AGENT_WAITING) without setting its explicit\
        \ block; waiting=false clears it. Ignored for a status that starts no phase,\
        \ a feature or a task, and a frame older than the entity's last activity.\
        \ Never refuses a dispatch."
      operationId: reportWorkAgentWaiting
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkAgentWaitingReport"
        required: true
      responses:
        "204":
          description: The frame was taken (or ignored)
        "400":
          description: No waiting value
        "404":
          description: No entity with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Agent Waiting Controller
      security:
      - SecurityScheme:
        - qits:system
  /projects/api/work/{qualifiedId}/audit:
    get:
      summary: A work entity's change history
      description: "Newest first. A root (epic, ticket, campaign) answers its whole\
        \ subtree — its features, tasks and every thread under it, deleted rows included;\
        \ a feature or a task its own rows. The path names the entity by qualified\
        \ id (<projectSlug>-<n>) or UUID; a UUID still answers after the entity is\
        \ deleted."
      operationId: getWorkAudit
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkAudit"
        "404":
          description: A qualified id naming no entity
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Audit Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/blocked:
    post:
      summary: Block or unblock a work entity
      description: "Says the phase an epic's, ticket's or campaign's status starts\
        \ cannot finish right now (or can again). The status does not move — it is\
        \ the phase to resume — and the next transition clears the block. The reason\
        \ is required to block and lands on the entity's thread."
      operationId: setWorkBlocked
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkBlockRequest"
        required: true
      responses:
        "200":
          description: The flag as the write left it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkBlockAnswer"
        "400":
          description: Blocking with no reason
        "403":
          description: An agent blocking outside its own project; nothing is written
        "404":
          description: No entity with this id
        "409":
          description: "A feature or a task (which runs no phase of its own), or a\
            \ status that starts no phase (VERIFIED, DONE, DROPPED)"
        "401":
          description: Not Authorized
      tags:
      - Work Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/children:
    get:
      summary: A work entity's children
      description: "An epic's features or a feature's tasks, in membership order,\
        \ in the merged shape with their qualified ids; empty for a kind nothing hangs\
        \ under. The path names the parent by qualified id (<projectSlug>-<n>) or\
        \ UUID."
      operationId: listWorkChildren
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkChildren"
        "404":
          description: No entity with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Children Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    post:
      summary: Add a child to a work entity
      description: "A feature under an epic, a task under a feature: the child kind's\
        \ create, placed under the entity the path names. Its status starts REPORTED;\
        \ the parent's plan must still be REPORTED. Answers the child in the merged\
        \ shape, with its qualified id."
      operationId: createWorkChild
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkChildCreate"
        required: true
      responses:
        "201":
          description: The child as created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionedEntity"
        "400":
          description: "A body the child's create schema refuses, or one naming archetype,\
            \ parent or project"
        "403":
          description: An agent outside its own project
        "404":
          description: "No entity, repository or dependency"
        "409":
          description: "A kind nothing hangs under, or a parent whose plan is frozen"
        "401":
          description: Not Authorized
      tags:
      - Work Children Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/comments:
    get:
      summary: Read a work entity's comment thread
      description: "The thread of an entity of any archetype, oldest first. The path\
        \ names the entity by qualified id (<projectSlug>-<n>) or UUID."
      operationId: listWorkComments
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The thread, oldest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCommentList"
        "404":
          description: No entity with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Comment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
        - qits:system
    post:
      summary: Comment on a work entity
      description: "Adds a remark to the thread of an entity of any archetype, named\
        \ by qualified id or UUID. The author is stamped from the caller."
      operationId: addWorkComment
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCommentCreate"
        required: true
      responses:
        "200":
          description: The comment as written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCommentAnswer"
        "400":
          description: A blank body
        "403":
          description: An agent commenting outside its own project; nothing is written
        "404":
          description: No entity with this id
        "401":
          description: Not Authorized
      tags:
      - Work Comment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
        - qits:system
  /projects/api/work/{qualifiedId}/comments/{commentId}:
    patch:
      summary: Edit a comment's text (JSON merge patch)
      description: "Replaces the body of a comment on a work entity's thread. Only\
        \ body is written; the author stays who wrote it, and updatedAt moves."
      operationId: editWorkComment
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/WorkCommentPatch"
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCommentPatch"
        required: true
      responses:
        "200":
          description: The comment as it stands after the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCommentAnswer"
        "400":
          description: "Every complaint about the body in one message: not an object,\
            \ empty, body null or blank or not a string, a server-owned or unknown\
            \ property"
        "403":
          description: An agent editing a comment outside its own project; nothing
            is written
        "404":
          description: "No entity with this id, or no comment with this id on its\
            \ thread"
        "401":
          description: Not Authorized
      tags:
      - Work Comment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    delete:
      summary: Delete a comment
      description: Removes a comment from a work entity's thread; audited. Admin only.
      operationId: deleteWorkComment
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The comment is gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCommentDeleted"
        "404":
          description: "No entity with this id, or no comment with this id on its\
            \ thread"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Comment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /projects/api/work/{qualifiedId}/dispatch:
    get:
      summary: What a dispatch press would start now
      description: "The entity's status, the phase a press would start (or null),\
        \ whether it is blocked and dispatchable, and the mode the last press recorded.\
        \ The path names the entity by qualified id or UUID."
      operationId: getWorkDispatch
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The dispatch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDispatchState"
        "404":
          description: No entity with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    post:
      summary: "Put an agent on an epic or a ticket, or start a campaign"
      description: mode PHASE runs the one phase the entity's status starts; mode
        FLOW runs that phase and the ones after it until a status starts none. On
        a campaign the press is its start. The path names the entity by qualified
        id (<projectSlug>-<n>) or UUID.
      operationId: dispatchWork
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkDispatchRequest"
        required: true
      responses:
        "200":
          description: "The dispatch made, or — for a campaign — its progress as the\
            \ start press left it"
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/WorkDispatchAnswer"
                - $ref: "#/components/schemas/WorkProgressAnswer"
        "400":
          description: A missing or unknown mode
        "404":
          description: No entity with this id
        "409":
          description: "A status that starts no phase, a feature or a task, a blocked\
            \ entity, a project with no wrapper"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /projects/api/work/{qualifiedId}/dossier:
    get:
      summary: Read a work entity's dossier
      description: "The dossier pages of an epic or a ticket in position order, bodies\
        \ included; empty, never 404, for an entity that has a dossier. The path names\
        \ the entity by qualified id (<projectSlug>-<n>) or UUID."
      operationId: listWorkDossier
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The pages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDossier"
        "404":
          description: "No entity with this id, or one with no dossier"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Dossier Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    post:
      summary: Add a page to a work entity's dossier
      description: Appends a page; its slug is minted from the title and never changes.
        An epic's dossier is writable while the epic is REPORTED; a ticket's at every
        status.
      operationId: createWorkDossierPage
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkDossierPageCreate"
        required: true
      responses:
        "201":
          description: The page as written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierPageDto"
        "400":
          description: A blank title
        "403":
          description: An agent outside its own project
        "404":
          description: "No entity with this id, or one with no dossier"
        "409":
          description: "An epic past REPORTED: its plan is frozen"
        "401":
          description: Not Authorized
      tags:
      - Work Dossier Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/dossier-assets:
    get:
      summary: List the figures a work entity's dossier inlines
      description: "Each asset's kind, mime type, label, content URL, markdown line\
        \ and the pages that name it, by label. No bytes: getWorkDossierAssetContent\
        \ serves those."
      operationId: listWorkDossierAssets
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The figures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDossierAssetList"
        "404":
          description: "No entity with this id, or one whose dossier inlines nothing"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Dossier Asset Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    post:
      summary: Copy a figure of the refinement into an epic's dossier
      description: "Copies a sketch or a design of the epic's own refinement in, keeping\
        \ its id, and answers the markdown line to paste. Inlining the same figure\
        \ again answers the same line. The path names the epic by qualified id (<projectSlug>-<n>)\
        \ or UUID."
      operationId: inlineWorkDossierAsset
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkDossierAssetInline"
        required: true
      responses:
        "200":
          description: The inlined figure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDossierAssetInlined"
        "403":
          description: An agent outside its own project
        "404":
          description: "No entity with this id, one whose dossier inlines nothing,\
            \ or no such figure in its refinement"
        "401":
          description: Not Authorized
        "400":
          description: Bad Request
      tags:
      - Work Dossier Asset Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/dossier-assets/{assetId}/content:
    get:
      summary: "The bytes of one figure a work entity's dossier inlines, sandboxed"
      description: "Served under the row's own mime type with Content-Security-Policy:\
        \ sandbox, X-Content-Type-Options: nosniff and private caching, on every response."
      operationId: getWorkDossierAssetContent
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The figure's bytes
          content:
            application/json:
              schema: {}
        "404":
          description: "No such entity, or no such figure in its dossier"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Dossier Asset Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/dossier/{page}:
    put:
      summary: Retitle or rewrite a page
      description: "Writes the title, the body, or both. version is required: a stale\
        \ one is a 409 carrying the page as it stands (under current), never a merge.\
        \ The slug never moves."
      operationId: putWorkDossierPage
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkDossierPageWrite"
        required: true
      responses:
        "200":
          description: The page as written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierPageDto"
        "400":
          description: No version
        "403":
          description: An agent outside its own project
        "404":
          description: "No such entity, or no such page in its dossier"
        "409":
          description: "A stale version (the current page is in the body), or a frozen\
            \ epic"
        "401":
          description: Not Authorized
      tags:
      - Work Dossier Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    get:
      summary: Read one page of a work entity's dossier
      description: "The page named by its slug (or, as a fallback, its id)."
      operationId: getWorkDossierPage
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierPageDto"
        "404":
          description: "No such entity, or no such page in its dossier"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Dossier Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    delete:
      summary: Remove a page from its dossier
      description: The pages after it close the gap.
      operationId: deleteWorkDossierPage
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The page is gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDossierPageDeleted"
        "403":
          description: An agent outside its own project
        "404":
          description: "No such entity, or no such page in its dossier"
        "409":
          description: A frozen epic
        "401":
          description: Not Authorized
      tags:
      - Work Dossier Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/dossier/{page}/move:
    post:
      summary: Move a page within its dossier
      description: Positions stay dense and 0-based.
      operationId: moveWorkDossierPage
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkDossierPageMove"
        required: true
      responses:
        "200":
          description: The page in its new position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierPageDto"
        "403":
          description: An agent outside its own project
        "404":
          description: "No such entity, or no such page in its dossier"
        "409":
          description: A frozen epic
        "401":
          description: Not Authorized
        "400":
          description: Bad Request
      tags:
      - Work Dossier Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /projects/api/work/{qualifiedId}/members:
    get:
      summary: A campaign's members
      description: "Every membership in campaign order: the entity it gathers, its\
        \ run record and its condition. The path names the campaign by qualified id\
        \ (<projectSlug>-<n>) or UUID."
      operationId: listWorkMembers
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkMemberList"
        "404":
          description: No campaign with this id
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Work Members Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    post:
      summary: Gather an entity into a campaign
      description: "Adds a membership — at position, or at the end — for an entity\
        \ named by qualified id or UUID. A bound agent adds only in its own project."
      operationId: addWorkMember
      parameters:
      - name: qualifiedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkMemberAdd"
        required: true
      responses:
        "201":
          description: The membership as written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkMemberAnswer"
        "400":
          description: No entityId
        "403":
          description: An agent outside its own project
        "404":
          description: "No campaign, or no entity, with this id"
        "409":
          description: "The entity cannot join: already a member, a feature or a task,\
            \ a closed campaign"
        "401":
          description: Not Authorized
