# The application config for qits-projects as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `domain` and `epics` ship DEFAULTS they do not own the deployment of. Their datasources, Flyway
# lineages and repositories data-dir stay there; a deployment still overrides any of them by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# private copies in src/test/resources and the packaged app had none.

quarkus.application.name=qits-projects

# The JAX-RS prefix every qits route lives under: /<segment>/api, where the segment is this
# service's name without the qits- prefix. The edge path-routes every application's segment on
# EVERY host — /projects/* reaches qits-projects from ci.<env>.<domain> as readily as from this
# service's own host — so the leading segment is not decoration, it is the difference between this
# service being reachable and not. Everything it serves hangs off it: /projects/api/projects,
# /projects/api/repositories, /projects/api/epics, /projects/api/features, /projects/api/tasks.
# Drop or shorten it and every caller 404s. Note the remote-login websocket does NOT follow this key
# — @WebSocket takes a literal path and spells the prefix out itself (RemoteLoginTerminalSocket).
#
# THE SEGMENT IS SPELLED IN FOUR PLACES and they move together: this key, the MCP root-path and
# quarkus.http.non-application-root-path below, and `routes:` in .config/qits/deployments.yml. The
# SPA no longer spells it — it is served at `/` on this service's own host (ui-root-path below).
quarkus.rest.path=/projects/api

# The named MCP server the repository tools are registered under (@McpServer("repository")), served
# under this service's segment. The server NAME stays `repository` while the path becomes
# /projects/mcp: these tools are genuinely repository-scoped and qits-workspace-daemon addresses the
# server by that name. (qits-observability renamed its own `repository` server to `observability` —
# it had no repository tools in it, and two servers sharing a name meant the daemon could only ever
# point at one of them.) Not optional: quarkus-mcp-server-http rejects an undeclared server name
# outright ("Invalid server name"), so omitting this does not disable the tools — it stops the
# process booting.
quarkus.mcp.server.repository.http.root-path=/projects/mcp

# Quarkus' non-application root path: what the framework serves rather than application code (the
# OpenAPI document, swagger-ui, health). It sits OUTSIDE quarkus.rest.path and moves only via this
# key, so without it /q/* stays at the root — where the SPA now lives, and where a path-routing edge
# would never look for this service's health.
quarkus.http.non-application-root-path=/projects/q

# --- the API document -------------------------------------------------------------------------
# Served at /projects/q/openapi, with the browsable UI at /projects/q/swagger-ui — both under
# quarkus.http.non-application-root-path above, not quarkus.rest.path. quarkus.swagger-ui.path is
# relative by default and follows automatically; do not pin it.
# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
#
# This is the largest published surface of the six services and the one an Angular client is
# generated from, so the committed docs/openapi.yml matters more here than anywhere else.
quarkus.smallrye-openapi.info-title=qits-projects API
quarkus.swagger-ui.always-include=true

# --- the web UI ---------------------------------------------------------------------------------
# The Angular SPA in service/src/main/webui — a submodule on qits-spa-projects' own main, not a
# vendored copy. Quinoa runs its npm build during augmentation and registers the output as static
# resources, so one process serves the UI and the API and the gateway needs no second upstream.
#
# TWO THINGS THIS ADDS TO A BUILD, both new to this repo's clone-alone rule:
#   - the submodule has to be checked out. `git clone` alone leaves src/main/webui empty and Quinoa
#     then finds no package.json; `git submodule update --init` is now part of a fresh clone.
#   - an npm and a node have to be on PATH. The Angular CLI at 21 wants node ^20.19 || ^22.12 || >=24;
#     the mandrel builder image in docker/Dockerfile ships neither, so the container image build
#     needs a node installed in that stage (or quarkus.quinoa.package-manager-install).
# Neither reaches `./mvnw verify`: Quinoa is disabled in test mode by default, so the suite is green
# with an empty webui dir and no node at all. Only a `package` builds the UI.
#
# THE SPA IS SERVED AT THE ROOT, because this service has a host of its own:
# projects.<env>.<domain> is qits-projects, and the client is what a person arriving there wants.
# The scoped addresses the platform's SPAs share start at the first segment — /<projectSlug>/,
# /<projectSlug>/<category>/<repoName>/ — so there is no segment left to spend on saying which
# application this is. It is also the platform's landing page: the edge sends `/` on the
# environment host here.
#
# The API keeps its segment (quarkus.rest.path above) and so does every wire route, because the
# edge path-routes them on every host. What keeps them out of the SPA's catch-all is
# quarkus.quinoa.ignored-path-prefixes below.
quarkus.quinoa.ui-root-path=/

# Deep links. Without this a GET /qits/services/qits-ci is a 404 from the static handler rather than
# the SPA's own route — the client only ever sees its router if index.html is what comes back for a
# path the build produced no file for.
quarkus.quinoa.enable-spa-routing=true

# Where Angular leaves the bundle, relative to the webui dir. `dist/<project>/browser` is the
# application builder's layout since Angular 17 (the browser/ level is where the SSR split put it);
# spelled out rather than left to Quinoa's framework detection, since the name in it is the SPA's
# package name and a rename would otherwise fail as an empty UI rather than as a build error.
quarkus.quinoa.build-dir=dist/qits-spa-projects/browser

# What SPA routing must NOT swallow. The re-route is a catch-all at /* registered near-last, so
# anything with a real route in front of it still wins — but a request matching NO route is
# rerouted to index.html and answers 200 text/html instead of 404. That is fine for a person, who
# gets the client's own not-found page, and wrong for a machine, which parses index.html as garbage
# data: GET /projects/mcp/nonexistent returned 200 HTML before this line existed, while
# /projects/mcp itself answered 405 because it has a real route.
#
# THESE ARE ABSOLUTE REQUEST PATHS NOW, because ui-root-path is `/` and there is nothing left to
# strip. They used to be tails relative to /projects, which is why the whole list collapses into
# ONE entry: /projects is a prefix match, so it covers /projects/api, /projects/q, /projects/mcp,
# /projects/daemon, /projects/container, /projects/refinement-daemon and
# /projects/refinement-container in one line. This service owns no route outside that segment, so
# there is nothing to add beside it; a service that served /v2 or /git would list those too.
#
# Quinoa DERIVES this list when the key is unset, from quarkus.rest.path and
# quarkus.http.non-application-root-path — and the derivation is still incomplete here (nothing it
# reads names the MCP root-path or the two daemon harnesses' raw routes), so the key stays set.
quarkus.quinoa.ignored-path-prefixes=/projects

# Repository imports and archetype templates move real trees around; the monorepo raised this
# app-wide and these routes inherited it.
quarkus.http.limits.max-body-size=64M

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-projects` rather than qits-projects-service-<version>-runner, so
# `-Dnative` produces target/qits-projects and the process is identifiable in `ps` / `docker top`.
# The failsafe plugin's native.image.path in service/pom.xml spells the same name; the two are the
# same string in two files and move together.
quarkus.package.output-name=qits-projects
quarkus.package.jar.add-runner-suffix=false

# ForeignPty must be initialised at RUN time, and this line is the difference between a native
# build and no native build at all.
#
# Quarkus initialises application classes at BUILD time by default. For ForeignPty that means its
# `static final` downcall MethodHandles are constructed by the image builder and land in the image
# heap — and a MethodHandle bound to a native entry point cannot be analysed there. The build dies
# in the pointsto analysis with `unexpected input could not be handled: linkToNative`, pointing at
# ForeignPty.open. It is exactly backwards from what one expects: making the handles build-time
# constants is what breaks it, and the same class initialised at run time builds and runs.
#
# The descriptors themselves are declared in domain's
# META-INF/native-image/.../reachability-metadata.json. Both are required and neither substitutes
# for the other: without the metadata GraalVM registers zero downcall stubs, without this flag it
# never gets far enough to use them.
quarkus.native.additional-build-args=--initialize-at-run-time=eu.wohlben.qits.projects.control.ForeignPty

# The two committed skeletons: the wrapper's first commit (`project-template/`) and a blank
# component's (`repository-template/`). A native image includes NO classpath resource it was not
# told about, and nothing tells it about these: ProjectTemplate walks them as directory trees, so
# there is no single resource name for the builder to have noticed. Without this line the image
# builds happily and then every POST /projects/api/projects fails with "The template is missing from
# the classpath" — the route that creates a project, in a service whose whole purpose starts there.
# The trailing `**` has to cover the nested directories (services/, frontends/, .config/qits/, …),
# not just the top level.
quarkus.native.resources.includes=project-template/**,repository-template/**

# The same flag is NOT settable here for the JVM path, and that asymmetry is worth a note: a runner
# jar cannot add its own JVM flags, so no property fixes it. Pass it on the command line:
#
#     java --enable-native-access=ALL-UNNAMED -jar target/quarkus-app/quarkus-run.jar
#
# domain's surefire block sets it for tests, which is the other place a JVM opens a PTY.

# --- what a new project announces itself to -----------------------------------------------------
# Nothing, and there is no key here to set. A project's domain is handed to the ProjectDomainRegistrar
# port, qits-platform-dns was its only implementation, and that service is gone from the platform —
# so the port has no implementation, the creation hook fires nothing, and a project's dns records are
# configured by hand at the external provider. The port stays as the hook a replacement plugs into;
# whatever ships next brings its own address key with it.
#
# There is no qits.cd.url here either. A project used to announce a cd environment of its own;
# qits-cd owns environments now — deliberate tiers created over its REST surface, not one per
# project.

# --- reserved project slugs ---------------------------------------------------------------------
# The platform's ENVIRONMENT NAMES, comma-separated — the one slug family this service cannot
# compile in, because environments are created and removed on a running platform. Seeded by the
# bootstrap (QITS_PROJECTS_RESERVED_SLUGS=dev,prod,…); UNSET SHIPPED, and unset means the static
# ProjectService.RESERVED_SLUGS and nothing else, which is a supported configuration.
#
# WHY AN ENVIRONMENT NAME CANNOT BE A SLUG: the web editor is served at editor.<project>.<domain>
# while every application is served at <app>.<environment>.<domain>, and the edge tells the two apart
# by reading the first two labels of the host. A project whose slug spells an environment makes
# `editor.dev.<domain>` parse as "the application editor in the environment dev" — the project label
# does not survive the reading. An APPLICATION-name collision is harmless (the first label is
# `editor`, never the slug) and is deliberately not guarded.
#
# A supplied reserved slug is a 400 naming the word and the reason; a DERIVED one suffixes past it
# like any other collision, so a project named "Dev" still creates, as `dev-2`. ReservedSlugAudit
# reports at boot, loudly and without failing it, any project already sitting on a reserved word — a
# slug is immutable, so a list that grows past an existing project is a decision, not a repair.
#qits.projects.reserved-slugs=

# --- repository backup ------------------------------------------------------------------------
# Every repository this platform serves is mirrored onto a FORGE TWIN — the GitHub repository its
# project's wrapper implies. Two triggers keep the twin current and they are not redundant: the git
# host's SCM events (SCMPublishCommit, SCMPublishTag, SCMDeleteBranch, SCMDeleteTag) arrive on the
# bus and bus/ScmBackupTriggerListener schedules a backup per event, current within seconds of real
# work; and the sweep below re-asserts everything on an interval (eventually current after an
# unreachable forge or an expired credential — failures no event can announce).
#
# THE FIRST TRIGGER USED TO BE AN HTTP ROUTE, POST /projects/api/events/post-receive, called from the
# git host's own hook. It is gone. The events are durable, so "a push landed while this service was
# restarting" left the sweep's job and joined the event path's.
#
# The kill switch stops BOTH triggers, which is the point of it living on the service rather than on
# the scheduler: turning it off has to actually stop pushing to forges.
qits.projects.backup.enabled=true

# How often the sweep runs. Modest on purpose — it is a safety net under the event trigger, not the
# mechanism.
qits.projects.backup.interval=1h

# How long a push-triggered backup waits before running, so one `git push` of several branches
# produces one backup rather than one per branch. The events arrive together; this is what collapses
# them.
qits.projects.backup.debounce-ms=2000

# --- the per-project agent harness --------------------------------------------------------------
# One container per project, holding a clone of that project's wrapper repository and running
# qits-projects-daemon over it. Started on demand by POST /projects/api/projects/{id}/agent-container
# /ensure, reached only through the reverse tunnel, and stopped by the idle sweep or the Stop verb.
# Everything host-side is in service/.../agenthost/; the container's own process is a separate repo.
#
# THREE OF THE VALUES BELOW ARE CROSS-REPO CONTRACTS and are read from the daemon repo's AGENTS.md
# rather than chosen here: the API token, the API port and the hooks port are injected as
# QITS_PROJECTS_DAEMON_API_TOKEN / _API_PORT / _HOOKS_PORT, and the daemon's defaults must match or
# the proxy talks to a port nothing binds. The two PATHS are contracts too, but they are not config
# at all — they live in DaemonProtocol's constants, which arrive here in the released
# qits-projects-daemon-protocol jar, so both repos read one spelling of them rather than two copies.

# The image an agent container runs: the workspace toolchain (so the agent can build and test the
# components it is refining) with the daemon binary layered on, exactly the qits/workspace pattern.
#
# THE REGISTRY HOST IS PART OF THE VALUE, which is the one thing here that looks wrong, so: artifact
# *declarations* are unqualified on purpose, because the registry is spelled one way inside a step
# container and another way outside it, and a declaration must not pick a side. This is not a
# declaration. It is a runtime reference. qits-projects hands this exact string to `docker run` on
# the HOST daemon, through the mounted socket, so it has to be spelled the way the HOST daemon
# resolves it — the same `registry.dev.localhost:8080` $QITS_REGISTRY already carries for qits-ci
# and qits-deployments. The registry sits behind the edge proxy now and has no host-published port
# of its own; the host daemon resolves the vhost and carries it in insecure-registries.
#
# UNQUALIFIED WOULD BE THE BUG. A bare name resolves against whatever happens to sit in the host's
# local image store, and that is precisely the drift this removes: `qits/project-agent:native` was a
# hand-built tag on one machine, nothing recorded which daemon build was inside it, and the
# re-bootstrap that deleted it left the platform with no way to start an agent at all. The image is
# a released artifact now — qits-projects-daemon's release pipeline builds it from the published
# toolchain base plus the published daemon binary and pushes it — so there is a real reference to
# name.
#
# PINNED TO A VERSION, not a floating tag, because an agent container should be reproducible: one
# qits-projects release must always start one agent image. The reference is still composed of two
# halves and joined as `<repo>:<version>` — but only the repo half is configuration now.
#
# THE VERSION IS NOT IN THIS FILE AND IS NOT A CONFIGURATION ENTRY. It is a POM PIN:
# `eu.wohlben.qits:qits-projects-daemon-protocol`, whose ${project.version} IS the tag both of
# qits-projects-daemon's images were pushed under, carries it as ProjectAgentImage.VERSION and
# AgentContainerFactory reads it from there. So the version moves by an edit to the root pom's
# qits.projects-daemon-protocol.version, on a branch, through this repository's own release request,
# proven against the daemon it names by ProjectAgentDaemonPinIT.
#
# WHAT THAT REPLACED, and why the replacement was worth a ticket: the version used to arrive as
# QITS_PROJECTS_AGENT_IMAGE_VERSION, written into this deployment by qits-configuration's release
# listener the moment the image was pushed. A new agent image therefore reached the next real
# refinement run with NOTHING having tested the pair — a daemon that changed the wire would be
# discovered by a person whose agent container came up and never dialled home. The line below it,
# a committed fallback default, aged in the other direction: it named 2026.820.154053, an image the
# registry's retention was free to have deleted. A dependency can do neither. It has to resolve for
# this reactor to build at all, and the pin test makes it speak before the release request folds.
#
# THERE IS NO DEFAULT FOR THE OVERRIDE, and absent is the shipped state.
# `qits.projects.agent-image-version-override` (QITS_PROJECTS_AGENT_IMAGE_VERSION_OVERRIDE) starts a
# different tag when a deployment sets it, and is an emergency hatch that must stay unset — a
# deployment carrying one is running an image nothing in this repository gated. It is spelled
# `-override` rather than reusing the old name deliberately: the old name IS the name the release
# listener writes, so the automatic pin and the manual override were one string and the automatic
# one won on every deploy. Nothing deletes a configuration entry on this platform and this service
# holds no credential that could, so the entries already written are still out there and would still
# win; a different name is what makes them stop deciding. RetiredImageVersionKeys warns at boot when
# the old one is set, which is how the residue becomes a work item instead of a trap.
#
# THE REGISTRY HOST IS STILL PART OF THE VALUE BELOW, for the reasons above it. The pin carries
# ProjectAgentImage.AGENT_REPOSITORY unqualified — the registry is one service under several
# addresses and an OCI reference cannot carry a path prefix — so the reader supplies its own host,
# and this key is this reader's.
qits.projects.agent-image-repo=registry.dev.localhost:8080/qits/project-agent

# The shared docker network the container joins and qits-projects is on, so the daemon can dial the
# control socket by DNS name. NOT created here — the bootstrap owns qits-net and the orchestrator
# only joins it. The container publishes no host ports and needs none, because its only server binds
# loopback.
qits.projects.agent-network=qits-net

# How a container addresses this service. Composed into QITS_PROJECTS_DAEMON_URL at creation because
# the daemon runs in-container and cannot resolve it — it dials what it is handed, verbatim.
qits.projects.own-host=qits-projects
qits.projects.own-port=8080

# The git host the daemon's boot self-clone reads from, INCLUDING qits-githost's own /git
# prefix — the daemon appends /<projectId>/<repoName> to it. Stated outright rather than left to the
# daemon's own fallback, which would derive a DIFFERENT service's address from this one's authority
# and emit a WARN saying so.
#
# The same internal alias qits.projects.refinement-git-url names below, and for the reason spelled
# out there — and NOT qits-githost's service alias, which is what this key used to say. What is new
# here is the caller: an agent container fetches with `qits checkout-daemon`, which authenticates
# through the credential helper baked into the image, so at the service alias the container is left
# unable to fetch at all. Kept in step with qits.githost.url (shipped in domain's
# META-INF/microprofile-config.properties) by hand, because that key carries no path and names the
# address THIS service dials rather than a container's.
qits.projects.agent-git-base=http://githost.dev.internal:8080/git

# The ONE MCP server an agent launch inside the container attaches, injected as
# QITS_REPOSITORY_MCP_URL (the daemon's existing qits.repository-mcp.url key). It is THIS service, at
# quarkus.mcp.server.repository.http.root-path — the `repository` server, which carries the epic
# tools a refinement session drafts through as well as the repository ones.
#
# Left blank on purpose: the value is composed from own-host/own-port above, which is the same
# address the control socket already names, so no deployment has to configure it. Set it to point an
# agent at a different qits instance, or at a separately deployed MCP server if that ever splits out.
#
# EXACTLY ONE, and that is a decision. qits-workspace-daemon wires three servers into a workspace
# container — actions, repository, observability — and none of the other two is injected here: a
# refinement agent's job is the project's PLAN, not workspace actions or another service's telemetry.
# The daemon cannot re-add them either; it addresses `repository` alone and refuses any other name.
qits.projects.agent-mcp-url=

# The bearer the daemon's loopback API requires and ContainerProxyRoute presents on every forwarded
# request. NOT a boundary: the API binds 127.0.0.1 and has no address on the shared network at all,
# so this is peer authentication behind that, and defence in depth rather than the fence. It has a
# default so a deployment needs no configuration — but it is fail-closed at the other end: a daemon
# handed no token does not bind its API, because an omitted env is indistinguishable from a
# misconfiguration and a server over an untrusted checkout must degrade to unavailable, never to
# anonymous.
qits.projects.daemon-api-token=qits-projects-daemon

# The two loopback ports inside the container. The API port is also the authority the proxy PINS on
# every forwarded request, so the daemon's view of who called it does not change when the tunnel's
# ephemeral loopback port does.
qits.projects.daemon-api-port=13338
qits.projects.daemon-hooks-port=13337

# Where the agent configuration document lands INSIDE the container — the path the daemon hands the
# shared harness library's readFrom, told rather than derived, exactly like the claude mount and the
# hooks port above.
#
# The document itself travels beside it, as QITS_AGENT_CONFIGURATION in the same spec. That is not
# what the epic specified — it settled on a mounted file — and it is the only shape available: this
# service reaches docker through qits-containers, whose Spec carries volumeMounts and sharedMounts
# and no way to materialize host content, and this service holds no docker socket and writes nothing
# to the docker host. So the daemon writes the file at boot from the value it was created with.
# /tmp because that file is derived state rather than durable, and because it is the one place
# writable by the arbitrary host uid the container runs as: /workspace is the project's git checkout
# and /claude-home is the platform-wide credential volume every other container also mounts.
#
# Blank switches the injection off: neither variable is set, and the daemon falls back to the
# library's shipped constants — the state every container created before this shipped is in.
qits.projects.agent-configuration-path=/tmp/qits/agent-configuration.json

# The harness capability relay: after a container's daemon says hello, read its GET /agents/available
# and pass the body into PUT /projects/api/agent-capabilities. Off the request path entirely — it is
# fired from the control socket's Hello, never from an ensure and never from the editor's read.
# A daemon that does not answer the three new members yet is the ordinary case and is quiet.
qits.projects.agent-capabilities.relay-enabled=true
qits.projects.agent-capabilities.relay-timeout-ms=10000
# Hello is the first moment the container is reachable, NOT the moment it can answer this: the daemon
# dials home in parallel with its boot self-clone, and it is the clone's worker that probes the
# harnesses and only then binds the loopback API. So the read is retried while the daemon says "not
# yet" — nothing on the wire announces that moment, and a 503 (agent surface unwired) or an unreached
# API is what "not yet" looks like from here. A window that ends unanswered is a WARN naming the
# project; every terminal answer, an older daemon's included, still costs exactly one attempt.
# Twelve attempts with this backoff is ~4 minutes: 2s, 4s, 8s, 16s, then 30s apiece.
qits.projects.agent-capabilities.relay-attempts=12
qits.projects.agent-capabilities.relay-retry-initial-ms=2000
qits.projects.agent-capabilities.relay-retry-max-ms=30000
# Dark under test, the way the bus and the release sweep are. Every suite that plays a daemon says
# Hello, and an automatic outbound read on each of those is traffic no test asked for — it raced the
# request AgentTunnelProxyTest was asserting and won. The relay is driven explicitly there instead,
# which proves the same hop and leaves the proxy's own assertions about the proxy.
%test.qits.projects.agent-capabilities.relay-enabled=false
# The same window compressed, so the retry can be asserted rather than only reasoned about: a test
# that waited the shipped backoff out would be a four-minute test.
%test.qits.projects.agent-capabilities.relay-retry-initial-ms=50
%test.qits.projects.agent-capabilities.relay-retry-max-ms=200

# The shared volumes, with the SAME NAMES qits-workspaces uses — shared platform-wide on purpose.
# The credential volume carries the operator's one-time agent OAuth login, so a divergent name here
# would give project agents their own unauthenticated agent home; the two caches mean a dependency
# fetched by any container is reused by every other one. Blank disables a mount.
qits.projects.claude-volume=qits_shared_dot_claude
qits.projects.claude-mount=/claude-home
qits.projects.maven-volume=qits_shared_m2
qits.projects.pnpm-volume=qits_shared_pnpm

# The per-project checkout volume's name prefix: prefix + the project ID, never the slug. The
# container is named after the slug so `docker ps` reads well; a checkout is addressed by the row's
# own key.
qits.projects.agent-volume-prefix=qits_project_

# Resource limits, the qits-workspaces defaults. Without a memory cap the container sees the whole
# host's RAM and every JVM inside sizes its default heap against that, which is how one build OOMs a
# host. Blank disables a cap. --memory-swap is set to the same value, so the cap is hard.
qits.projects.agent-memory-limit=4g
qits.projects.agent-pids-limit=
qits.projects.agent-cpus=
# Blank inherits this service's own zone, so wall-clock output in the container matches.
qits.projects.agent-timezone=

# The stop policy. An agent container is expensive and is started on the first open of a refinement
# panel — far more often than anyone remembers to stop it — so it has two ways down: the Stop verb
# and this sweep. It STOPS and never removes: the next ensure starts that same container again, with
# its docker id and everything outside its volumes intact. NOTHING HERE DISCARDS A CHECKOUT either
# way — the /workspace volume is the workload's own, the orchestrator refuses to remove it under this
# policy, and the daemon skips its self-clone on an already-populated one — which is what makes the
# one case that DOES replace the container safe: an agent-image bump landing while the agent was
# asleep is applied at wake. See ContainerRuntime.restart.
#
# THE SAME KEY IS THE ORCHESTRATOR'S WINDOW TOO. It rides on every spec as an IDLE_STOP policy, so
# that service runs the same sweep from its side as the belt for a qits-projects that died holding a
# container. The host sweep stamps what it keeps, so the belt cannot fire on a live session.
#
# The timeout is measured from the last thing the daemon said — its Hello, its heartbeat, or an
# agent lifecycle report — so it means "nobody is using this project", not "nothing is happening": a
# long silent build still heartbeats. Four hours survives lunch; a zero or negative value disables
# the sweep entirely (the Stop verb is unaffected). The interval is a floor on how late a stop is,
# not the timeout.
qits.projects.agent-idle-timeout=PT4H
qits.projects.agent-idle-sweep-interval=5m

# THE STALE-IMAGE SWEEP, which is a different question on a different clock — see
# AgentStaleImageSweep. A running agent container runs the image it was created with for ever: the
# only door that applies a new pin is the wake path's Recreate.ifChanged, and that door is reachable
# only from a STOPPED container. Nothing stopped one, because the idle window above is measured from
# everything the daemon says INCLUDING its unconditional 20-second heartbeat, so it never elapses on
# a container that is up. So an image bump reached a container only when a person happened to press
# Stop. This sweep is the missing stop: it stops — never removes — a running container whose daemon
# reports a version other than the pin, while that container is quiet.
#
# The quiet window is measured from the last thing that actually HAPPENED in the container (the
# heartbeat-free stamp), and the container's rolled-up agent state has to agree: the stamp catches an
# open terminal, which produces no agent activity at all, and the rollup catches an agent thinking
# between two frames. Thirty minutes is "nobody is mid-sentence", which is a far shorter question
# than the four hours above and is why the two are not one key.
#
# ZERO OR NEGATIVE DISABLES THE SWEEP — the kill switch, exactly as agent-idle-timeout's is, and
# emphatically NOT "stop every stale container now". The interval is a floor on how late a stop is.
qits.projects.agent-stale-quiet-window=PT30M
qits.projects.agent-stale-sweep-interval=15m

# How long an ENDED session keeps a say in a container's rolled-up agent state, the agent-axis twin
# of qits.projects.refinement.ended-activity-ttl-ms and shipped at the same half hour. Long enough
# that a session somebody is reading the tail of is still what this container is described as, short
# enough that a container whose last agent ended before lunch is not still described by it.
qits.projects.agent.ended-activity-ttl-ms=1800000

# AND HOW LONG AN ENTRY OF ANY STATE KEEPS ONE, which is a second horizon and not a longer version of
# the first. The TTL above ages out only the sessions that ANNOUNCED they were over, so a BUSY or
# WAITING entry was immortal: a session whose agent died, was killed, or whose container was replaced
# before its Stop/SessionEnd hook fired leaves a BUSY nothing takes back, and the control socket's
# reconnect adoption re-reports the daemon's retained per-command state on every reconnect. Observed
# live on 2026-09-18 — the stale-image sweep named one container in a WARN on three consecutive
# passes and could never stop it, because the fold answered BUSY for a session hours dead. In a UI a
# stuck BUSY is a chip somebody ignores; here it GATES AN ACTION, so it is a permanent veto, and it
# vetoes hardest on exactly the long-lived containers that sweep exists to reach.
#
# Four hours is a bound on HOW LONG A SINGLE AGENT TURN CAN PLAUSIBLY BE, not a guess at how long a
# session lasts: the daemon's hooks fire at turn boundaries (SessionStart, UserPromptSubmit, Stop,
# Notification, SessionEnd), so a live session refreshes its entry at every one of them and only a
# single turn still running four hours in could be cut short — and the action it releases is a stop,
# which is lossless because the checkout is on a volume nothing removes.
#
# IT MUST STAY STRICTLY LONGER THAN qits.projects.agent-stale-quiet-window. At equal values the fold
# could never veto anything the stamp had not already vetoed, which deletes the rollup's whole reason
# for existing — catching an agent thinking silently between two frames — with every test still green.
qits.projects.agent.stale-activity-ttl-ms=14400000

# The reverse tunnel. The daemon's API binds loopback, so qits asks for a stream over the control
# socket it already holds and the daemon dials OUT to serve it — there is no port on the network for
# a peer container to reach. `enabled=false` is an escape hatch for a broken tunnel, NOT a supported
# topology: switching it off makes the daemon unreachable rather than reachable some older way. The
# TTL bounds how long a minted dial-back nonce stays claimable; the only thing that happens in the
# window is one WebSocket dial.
qits.projects.agent-tunnel.enabled=true
qits.projects.agent-tunnel.nonce-ttl-ms=10000

# --- talking to qits-containers -----------------------------------------------------------------
# THERE IS NO CONTAINER RUNTIME BINARY HERE ANY MORE. `qits.projects.agent-container-runtime` named
# the `docker` (or `podman`) executable this service shelled out to, and this service shells out to
# nothing: qits-containers owns the daemon, and every container verb above is one HTTP call to it.
# The network is not this service's either — the bootstrap creates qits-net and the orchestrator
# only joins it, so the startup observer that used to create one is gone with the key.
#
# WHERE THAT SERVICE ANSWERS is qits.containers.url, and the three client deadlines beside it are
# shipped by the client jar at ordinal 100 — no copy of them belongs in this file.

# WHO THIS PROCESS IS to the orchestrator. The registry addresses a place as owner/workload/ref, and
# `owner` is compared against the machine token's `sub` once the far side's gate is on — so this
# value and the oidc-client's client id ARE THE SAME STRING, and the default says so rather than
# repeating it. qits-idp mints one client per environment (dev-qits-projects, prod-qits-projects),
# and that prefix is exactly what keeps two environments sharing one docker daemon from reaching
# each other's agent containers.
#
# A deployment sets QUARKUS_OIDC_CLIENT_CLIENT_ID=<env>-qits-projects and this key follows it; a
# deployment that wants them apart sets this one too and owns the consequence, which is a 403 from
# every route the moment that gate goes on. With it off the owner is trusted as it arrives, which is
# why the fallback is the bare literal and why a dev build needs no idp.
qits.projects.containers.owner=${quarkus.oidc-client.qits.client-id:qits-projects}

# How long a bring-up holds through an orchestrator that cannot AUTHORIZE it yet, or cannot be
# reached at all. MEASURED IN ANOTHER REPOSITORY, and copied here rather than rediscovered: on the
# 2026-08-12 rebootstrap the deploy train replaced qits-platform-idp and the next three qits-ci
# builds died at step launch with `refused 401` while every later one passed — a trailing-edge window
# of tens of seconds in which the caller's token, or the orchestrator's copy of the signing keys,
# belonged to the idp that had just been replaced.
#
# RETRYING IS SAFE: `ensure` is a PUT per (owner, workload, ref), so every attempt addresses the same
# place and a container an unanswered attempt created is adopted rather than duplicated. ONLY the
# answers that are about the moment are held through — 401, 403, and nothing answering. A refusal
# about the request (SPEC_CONFLICT, IMAGE_MISSING, a 400 on a value) is one attempt and one reported
# failure, because no window fixes it.
#
# The window bounds when a FRESH attempt may start; the attempt already running keeps the client's
# own ensure deadline (PT10M, which is mostly an image pull).
qits.projects.containers.ensure-patience=PT90S

# --- presenting a credential to qits-containers ---------------------------------------------------
# ONE SWITCH, shipped OFF: the extension builds a disabled client, this process boots with no secret
# and dials nothing, and the calls go out bare — which is what the orchestrator's own gate
# (qits.auth.machine.required, also off) expects. It is read TWICE on purpose, by the extension
# deciding whether to build a client and by ContainersClientProducer deciding whether to ask it for
# anything, because a second key of ours would be a second thing to get wrong.
#
# Turning it on is two environment variables and nothing else here moves:
#   QUARKUS_OIDC_CLIENT_CLIENT_ENABLED=true
#   QUARKUS_OIDC_CLIENT_CREDENTIALS_SECRET=<the secret qits-idp holds for this environment's client>
#
# The inbound resource-server half follows the machine-auth rollout gate. A deployed platform turns
# it on for the commissioned agent's direct control WebSocket; clone-alone tests and local
# development keep using forward-auth without needing a live IdP.
#
# THE AUDIENCE KEY IS qits-auth-core's, NOT THE TENANT'S, AND IT IS NOT OPTIONAL. MachineAuth's
# StartupEvent observer throws when the gate is on and `qits.auth.machine.audience` is unset — "a
# service that enforces must know which tokens are its own" — so the two tests that turn the gate on
# (BearerJwksTest through MockIdpTenant, and TokenValidationBootstrapIT) would fail to boot without
# it. The value is the platform's one audience rather than a name of this service's own: qits-idp
# puts `qits-platform` on every token it mints, so that IS which tokens are ours.
qits.auth.machine.audience=qits-platform
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}
quarkus.oidc.auth-server-url=http://qits-platform-idp:8080/idp
quarkus.oidc.application-type=service
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks
# ONE AUDIENCE, AND IT IS THE PLATFORM'S. qits-idp puts `qits-platform` on every token it mints, so
# a sibling service's machine bearer and a person's `qits` CLI token both address this service by
# that name; what a caller may do is decided by its roles, never by its audience. Spelled as a
# literal rather than as `${qits.auth.machine.audience}`: that key is the library's gate contract
# above and this one is the OIDC tenant's, and a tenant that read the library's key would follow an
# environment override of it into refusing every token the platform actually mints.
quarkus.oidc.token.audience=qits-platform

# FETCH KEYS WHEN A TOKEN NEEDS ONE, NEVER AT BOOT. Boot makes no call at all, so the tenant is
# ready at once whether qits-platform-idp is up or not; the key is looked up by the token's `kid`
# when a bearer actually arrives (the idp sets one on every token) and cached, and a `kid` nobody
# has seen — the idp rotated its keys — is fetched the same way.
#
# WHAT USED TO BE ON THIS LINE IS WHY IT IS HERE. With the default (true) the JWKS fetch runs
# during tenant creation at runtime-init, and `quarkus.oidc.connection-delay=30S` sat beside it
# telling Quarkus to keep trying the idp for half a minute ("Connecting to OpenId Connect Provider
# for up to 15 times every 2 seconds") — all of it on the startup thread, IN FRONT OF THE HTTP
# LISTENER. So a qits-projects deployed while the idp was not yet answering had no port open to
# answer a health probe with, and the deploy of 2026-09-14 was rolled back for exactly that:
# connection refused, for a service whose own code was fine. A listener must never wait on another
# service's availability, and the idp is not a startup dependency of this process — it is a
# dependency of a request that carries a bearer.
#
# qits-events and qits-observability made the same move first; this follows them. BearerJwksTest
# pins the behaviour, not the spelling.
quarkus.oidc.jwks.resolve-early=false
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the token this service PRESENTS ---------------------------------------------------------------
# ONE named client, `qits` (service-client-identity-plan.md, C4), carries every outbound identity
# this service has: the bearer sent to qits-containers, to qits-githost, to qits-ci, to
# qits-workspaces and to qits-maintenance, plus the HTTP Basic pair IdpAgentCredentials and
# IdpRefinementCredentials present to commission a per-container/per-refinement credential at
# qits-idp. It is the only named client this service has; the unnamed default one below it is inert
# and injected by nothing (see "the unnamed default client" further down).
#
# qits.projects.containers.owner reads this client's id by default (see that key's own comment
# above); IdpAgentCredentials and IdpRefinementCredentials read its id, secret and url directly for
# the Basic call they make, the same reason qits-ci's IdpCommissioner does.
#
# Its keys read QITS_RESOURCE_IDP_* first — what qits-deployments injects once this repository
# declares `resources: idp:client` in .config/qits/deployments.yml, a later and separate commit (plan
# C5) — and fall back to the unnamed default client's env names, which is what an environment that
# has not been re-bootstrapped still carries, so nothing here breaks before that commit ships.
# Reference the raw env name inside `${…}`, never the dotted key: the dotted key would also resolve
# the inert block's shipped values, and `client-enabled` would then read its `false`.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:${QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL:http://qits-idp:8080/idp}}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:${QUARKUS_OIDC_CLIENT_CLIENT_ID:qits-projects}}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:${QUARKUS_OIDC_CLIENT_CREDENTIALS_SECRET:}}
quarkus.oidc-client.qits.grant.type=client
# One audience for every outbound call now, service-client-identity-plan.md's ruling: qits-platform,
# never qits-containers, qits-githost, qits-ci, qits-workspaces or qits-platform-maintenance
# specifically. The receiving side accepts it because C1 (qits-auth-core) widened
# `quarkus.oidc.token.audience` to include qits-platform fleet-wide.
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
# qits-idp service tokens live for one hour. Refresh them before their JWT `exp` rather than on the
# first call after it: resource servers reject at `exp`, while TokensHelper's unskewed expiry check
# is whole-second based and can still hand that exact bearer to a sibling. That showed up as the
# hourly 401 from both qits-containers and qits-githost. Thirty seconds covers that boundary and
# ordinary clock/network variance without materially shortening the usable lifetime.
quarkus.oidc-client.qits.refresh-token-time-skew=PT30S
quarkus.oidc-client.qits.client-enabled=${QUARKUS_OIDC_CLIENT_CLIENT_ENABLED:false}
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- the unnamed default client, kept INERT --------------------------------------------------------
# NOTHING INJECTS IT. No `@Inject OidcClient` without `@NamedOidcClient("qits")` exists in this
# repository, and IdpAgentCredentials/IdpRefinementCredentials read `qits`'s own config properties
# directly for their Basic call. It is spelled out here because the env names the `qits` client falls
# back to — QUARKUS_OIDC_CLIENT_CLIENT_ENABLED, _CLIENT_ID, _CREDENTIALS_SECRET, _AUTH_SERVER_URL —
# are THIS client's names: an environment that sets them to switch `qits` on switches this one on
# too, and these seven lines are what stop that from becoming a boot-time call.
# `early-tokens-acquisition=false` and `discovery-enabled=false` are the two that matter — Quarkus
# defaults both the other way, and either one would put a fetch from qits-idp in front of the HTTP
# listener, which is the startup dependency `quarkus.oidc.jwks.resolve-early` exists to refuse.
# The keys stay complete rather than trimmed to those two, because a client Quarkus builds with half
# an address is a boot failure for a value nobody reads. It asks for no audience at all, because the
# one this platform mints is `qits-platform` and a client nobody injects has nothing to ask for.
quarkus.oidc-client.client-enabled=false
quarkus.oidc-client.auth-server-url=http://qits-idp:8080/idp
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=token
quarkus.oidc-client.client-id=qits-projects
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false

# --- the four names THE DEPLOYED ENVIRONMENT STILL MINTS, kept from dialling -----------------------
# NO CODE HAS THESE CLIENTS, and none of the blocks that used to stand here is coming back: every
# outbound bearer is `@NamedOidcClient("qits")`, and the client-id, secret, auth-server-url, grant
# type and grant-options audience those blocks carried really were dead. What is not dead is the
# ENVIRONMENT. Read out of qits-configuration for `dev` on 2026-09-15, each of `ci`, `githost`,
# `maintenance` and `workspaces` still carries the five keys qits-bootstrap's ComposeTemplate used to
# render — every one of them reported `orphaned`, which is how they will eventually be removed:
#
#   QUARKUS_OIDC_CLIENT_<NAME>_CLIENT_ENABLED=true   _CLIENT_ID   _CREDENTIALS_SECRET
#   QUARKUS_OIDC_CLIENT_<NAME>_AUTH_SERVER_URL       _GRANT_OPTIONS_CLIENT_AUDIENCE
#
# ONE ENVIRONMENT VARIABLE MINTS THE MAP KEY. SmallRye Config discovers `quarkus.oidc-client.<name>`
# from the environment source, so the client exists whether this file mentions the name or not, and
# with nothing here `client-enabled` and `discovery-enabled` BOTH DEFAULT TO TRUE. `initOidcClients`
# resolves the `OidcClients` bean during RUNTIME INIT, and its constructor runs
# `createOidcClient(...).await().atMost(connectionTimeout)` for each named key, serially, BEFORE THE
# HTTP LISTENER ACCEPTS. A refused connection is a fast WARN; an issuer that accepts and does not
# answer — a proxy in front of a still-starting qits-idp, or a wedged one — FAILS THE BOOT after the
# ten-second connection timeout, per client.
#
# `discovery-enabled=false` IS THE LINE THAT DOES THE WORK HERE, and `token-path` is not optional
# beside it. `client-enabled=false` would be the whole answer if this file were the only source —
# `createOidcClientUni` returns a `DisabledOidcClient` before it looks at anything else — but it is
# not: the env config source (ordinal 300) outranks this file (250, and 100 for a jar's
# microprofile-config.properties — either way env wins), so the
# deployment's `..._CLIENT_ENABLED=true` wins and the client is built regardless. What then decides
# whether it dials is discovery. And discovery off WITHOUT a token path is worse than the bug: the
# metadata is composed from auth-server-url plus token-path, an absent token-path leaves the token
# endpoint null, and `createOidcClientUniFromMetadata` throws "OpenId Connect Provider token endpoint
# URL is not configured and can not be discovered" from OUTSIDE the try/catch that turns a bad
# configuration into a `DisabledOidcClient` — so it would fail every boot rather than the unlucky
# ones. Hence three lines per name and no fourth: the client-id, secret and audience come from the
# same environment that forces the client on, and nothing injects these clients, so no
# `OidcClientRequestFilter` exists to make `early-tokens-acquisition` (the unnamed block's other
# guard) reachable.
#
# THESE LINES GO WHEN THE ENVIRONMENT'S ENTRIES GO, NOT BEFORE. The order is: delete each name's
# QUARKUS_OIDC_CLIENT_<NAME>_* entries from every environment, then delete the name here. Until a
# service's cutover, each service's fallback client keys stay. `configuration` is deliberately NOT
# here: `dev` carries no QUARKUS_OIDC_CLIENT_CONFIGURATION_* entry at all, so nothing mints that key
# and its block's deletion was already complete.
quarkus.oidc-client.ci.client-enabled=false
quarkus.oidc-client.ci.discovery-enabled=false
quarkus.oidc-client.ci.token-path=token

quarkus.oidc-client.githost.client-enabled=false
quarkus.oidc-client.githost.discovery-enabled=false
quarkus.oidc-client.githost.token-path=token

quarkus.oidc-client.maintenance.client-enabled=false
quarkus.oidc-client.maintenance.discovery-enabled=false
quarkus.oidc-client.maintenance.token-path=token

quarkus.oidc-client.workspaces.client-enabled=false
quarkus.oidc-client.workspaces.discovery-enabled=false
quarkus.oidc-client.workspaces.token-path=token

# --- the external MCP server catalog's credential reference ---------------------------------------
# An entry in the external MCP catalog (/projects/api/agent-mcp-catalog) stores a header NAME and a
# qits-configuration KEY, never a value. These two keys are how that reference is resolved when a
# container's document is built.
#
# THE NAMESPACE IS THE APPLICATION SEGMENT, AND THAT IS SETTLED. qits-configuration addresses a value
# by (env, application, key) and its key grammar is CLOSED — ConfigurationKeys.requireKey takes
# `env.<VAR>` and the four indexed families and 400s on everything else — so a `secrets.` or `mcp.`
# prefix could not be written there at all. The open axis is the application, which is also the axis
# the concern is really about: the worry is not the three characters `env`, it is that the key would
# be an environment variable OF AN APPLICATION, injected into that application's container by the
# deployer. Under the reserved application `qits-agent-mcp`, which nothing deploys, it is not. The
# application name is a constant in control/AgentMcpCatalog and is deliberately NOT configurable —
# a per-deployment namespace would be a per-deployment place for a credential to hide.
#
# BOTH UNSET SHIPPED, and unset is honest rather than degraded: with no external server attached to
# any surface nothing is read and nothing fails. Attach one without configuring these and the
# document build fails, naming the key — which is the designed failure, not an accident.
#
# There is deliberately NO DEFAULT FOR THE ENV. It is a real tier on this platform, and a guessed one
# would read another environment's credential — worse than reading none.
#qits.projects.agent-mcp.configuration-url=
#qits.projects.agent-mcp.configuration-env=

# --- commissioning a credential PER AGENT CONTAINER -----------------------------------------------
# Each agent container gets an idp client of its OWN, commissioned when the container is created and
# handed back when it is gone — so the credential a container authenticates its pulls, its maven and
# npm resolution and its git reads with has the container's lifetime and no other. Nothing durable
# is distributed: there is no shared secret for a container to hold.
#
# THE SAME SWITCH AND THE SAME KEYS as the block above. The commission API is HTTP Basic with THIS
# service's own client id and secret, the qits named client (service-client-identity-plan.md, C4) —
# a caller there already holds an idp credential, which is how it gets tokens at all — so
# quarkus.oidc-client.qits.client-enabled, .client-id, .credentials.secret and .auth-server-url are
# the whole configuration. With the switch off nothing is commissioned, nothing is injected, and a
# container's spec is byte for byte the spec it was before any of this existed.
#
# WHY DECOMMISSIONING IS A SWEEP HERE. Nothing in this service removes an agent container: stop and
# the idle sweep both stop, deleting a project leaves its container standing, and ContainerRuntime
# has no removal verb at all. So the hook the model asks for has no call site, and AgentCredentialReconcile
# compares what idp says this service commissioned against what the orchestrator says exists,
# at boot and on this interval.
qits.projects.agent-credentials.reconcile-interval=1h

# How long a commission holds through an idp that cannot answer or cannot authorize yet — 401, 403
# and nothing answering, the same three ensure-patience above holds through and for the same
# measured reason (a qits-platform-idp cutover). SHORTER than that one on purpose: this call sits in
# front of an image pull somebody opened a panel to wait for. Past the window the ensure fails and
# says so, because a container started without its credential has every read refused later, a long
# way from here.
qits.projects.agent-credentials.commission-patience=PT30S

# The bound on one commission/decommission/list exchange. The idp is a sibling on the same network
# and each of the three is one row.
qits.projects.agent-credentials.request-timeout=PT10S

# --- refinement containers ------------------------------------------------------------------------
# One container per REFINING epic, replacing the qits-workspaces workspace the refining route used
# to ride (epic refinement-improvements, part 2). The image is the WORKSPACE image — toolchain plus
# qits-workspace-daemon, reused unchanged: the daemon dials home to whatever
# QITS_WORKSPACE_DAEMON_URL names, and refinementhost/ is that home now. The spec, the credential
# commissioning and the teardown follow qits-workspaces' WorkspaceContainerFactory /
# IdpCredentialCommissioner contract; refinementhost/RefinementContainerFactory carries the
# deviations (no bootstrap, no services, no actions MCP) and why each one is deliberate.
#
# THE VERSION IS NOT IN THIS FILE, AND THERE IS NO DEFAULT HERE TO GO STALE. It is
# WorkspaceImage.VERSION — the version of eu.wohlben.qits:qits-workspace-daemon-protocol, the jar
# this reactor pins and whose own version IS the qits/workspace tag, because what this service must
# speak and what it must start are one release. The pin is a reviewed line in this repository's pom,
# gated by this repository's own release request, and it cannot age: the dependency has to resolve
# for the build to happen at all.
#
# It used to arrive as QITS_PROJECTS_REFINEMENT_IMAGE_VERSION, written by qits-configuration's
# ImagePins on every qits/workspace release and injected at the next deploy — so a version moved by
# whoever released the image reached the next refinement container with nothing having tested the
# pair, and the committed fallback that stood behind it aged in silence. Before that it was
# .config/qits/ci-event-upstream-workspace-daemon.yml rewriting a line here, force-pushing a
# maintenance/ branch and releasing this whole service to carry one number.
#
# The override key is qits.projects.refinement-image-version-override
# (QITS_PROJECTS_REFINEMENT_IMAGE_VERSION_OVERRIDE): Optional, NO default declared anywhere, and it
# MUST be empty in normal operation. Setting it pins an image no test has seen against this service,
# which is the honest reading of an emergency override. The old key is inert — nothing reads it —
# and refinementhost/RetiredRefinementImageVersionKey WARNs at boot while a deployment still carries
# the entry qits-configuration wrote, since nothing on this platform ever deletes one.
qits.projects.refinement-image-repo=registry.dev.localhost:8080/qits/workspace

# Where a refinement container reaches git — the same authority the deployed qits-workspaces
# injects into every workspace container (verified against a live container's
# QITS_WORKSPACE_DAEMON_GIT_BASE_URL / QITS_GIT_AUTH_HOST on 2026-08-23): the internal githost
# alias whose oauth2 transport turns the image's Basic credential helper into a Bearer. The
# daemon's clone base is this plus /git. NOT qits-platform-edge — the edge 401s the helper's
# exchange on this deployment, measured as `git clone exited 128` on the first live provision.
qits.projects.refinement-git-url=http://githost.dev.internal:8080

# The observability MCP server a repository-scope agent launch attaches beside this service's own
# repository server. Named outright rather than left to the daemon's derivation, which would guess
# it off THIS service's authority and be wrong. The dev spelling, like agent-git-base above; a
# deployment overrides per environment.
qits.projects.refinement-observability-mcp-url=http://dev-qits-observability:8080/observability/mcp

# The package registries a refinement's checkout builds against. Blank means unset, and unset means
# nothing is injected — the same deliberately-absent defaults as qits-workspaces' three keys, and
# the same reason: the artifacts alias carries the environment name, so a default here would be a
# guess at the deployment's topology. Deployment wiring supplies them when refinement builds are
# wanted.
qits.projects.refinement-maven-repository-url=
qits.projects.refinement-npm-registry-url=
qits.projects.refinement-npm-proxy-url=

# How often the refinement-kind commissions are reconciled against the rows that claim them — the
# belt for a crash between the idp's write and this database's. Same cadence as the agent kind's.
qits.projects.refinement-credentials.reconcile-interval=1h

# How long a refinement's computed git drift (ahead/behind/conflicts) is served before a read
# schedules the next background pass. The read itself NEVER computes it — see RefinementDrift for
# why: the computation opens with a mirror refresh, which is a full clone when the mirror is cold,
# and cold is exactly the state a freshly created refinement leaves it in. Drift arrives on the
# existing per-row `git-status` hint instead, so the page paints immediately and the strip fills in.
#
# Comfortably longer than qits.projects.git.mirror-freshness-ms (5s), which throttles the fetch
# underneath: that key says how often the mirror may be re-fetched, this one how often a row is
# worth asking about at all. Drift only moves when somebody pushes.
qits.projects.refinement.drift-staleness-ms=30000

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, the same
# shape as qits.projects.url. The ingest path is qits-observability's own and belongs to the
# service, not to the deployment, so it is spelled once here and derived rather than configured.
# Point this at a collector or a different host and everything below follows.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — OtelLogConfigTest pins these
# values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the platform event bus ---------------------------------------------------------------------
# This service LISTENS and publishes nothing. bus/ScmBackupTriggerListener consumes the git host's
# four SCM events durably and schedules a backup of the repository each one names; bus/
# EventstreamPushCausation carries the ambient cause onto every push this service makes TO the git
# host, so release -> push -> commit event -> CI run -> deploy stays one causation chain.
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. qits.events.url, the outbox's own datasource
# and Flyway lineage, the publish timeout, the retry budget, the redial backoff and the catch-up
# schedule all ship as ordinal-100 defaults in the qits-eventstream jar — the same way `domain` and
# `epics` ship theirs — and a copy in this file would be a second place to change and a silent way
# for the two to drift. A deployment overrides them by environment.
#
# What DOES belong here is the darkness, because the library ships enabled: a library that shipped
# dark would be one whose first deployment discovers it was never wired up, and the deployable is
# what owns where it is real. Same policy and same reasoning as the OTel keys above — a clone-alone
# `./mvnw verify` and a `quarkus:dev` have no qits-events on the far side, and enabled, the
# subscriber would redial a stream nobody serves while the sweeper paged a log that is not there.
#
# DARK IS NOT ABSENT. It stops publishing, sweeping and dialling; it does not stop the DATASOURCE.
# Quarkus opens the connection and runs Flyway at boot regardless, which is why this application
# declares a THIRD resource in .config/qits/deployments.yml and why the suite hands out a third
# database (testdb/ServiceEmbeddedPgConfigSource).
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- release requests ---------------------------------------------------------------------------
# The asynchronous release flow: a request folds N sources onto its own backing branch (release/<id>)
# at the git host, is settled by the build gate off the commit ledger, and is then RELEASED by this
# service itself — a calver stamped, the manifests bumped and committed onto the backing branch, that
# commit tagged, the consumed branches deleted, SCMRelease published.
#
# THE FLOW HAS TWO ADDRESSES IT ACTS THROUGH, and both are UNSET SHIPPED. A deployment names its
# tier's peers (http://dev-qits-githost:8080, http://dev-qits-ci:8080); unset, the flow is inert in a
# visible way rather than a silent one — see each key. Two further addresses below are NOT among
# them, because nothing is released through either: maintenance-url is one read that enriches an
# announcement and ships unset, and workspaces-url is one lifecycle call made after a release has
# already landed and ships with a working default.
#
# qits-githost, and the whole of what the release flow needs to write git. The octopus merge that
# folds a request's sources (POST …/merges), the tree and blob reads the version bump reads its
# manifests through, the bump's own commit (POST …/commits), the release tag (POST …/tags) and the
# deletion of the branches a release consumed (DELETE …/branches/{name}).
#
# A SEPARATE KEY FROM qits.githost.url on purpose: that one is where the mirrors clone from, this one
# is whether the release flow is on for this tier, and a tier must be able to switch the flow without
# changing how the service fetches git. Unset, every fold and every release refuses with a detail
# naming this key and the sweep tries again.
#
# The credential is the `githost` named OIDC client below (audience qits-githost). Every one of those
# routes takes qits:system, which a forwarded X-Qits-* pair cannot carry, so there is deliberately NO
# header fallback: unconfigured or uncredentialed, the flow refuses visibly.
#qits.projects.release-requests.githost-url=
#
# qits-ci, and two reads of the gate. GET /ci/api/runs/active is what keeps a VOUCHED request
# PENDING while other runs are still in flight on the same fold — a second pipeline can still
# come back red. Unset answers "could not ask", which never holds a green verdict back and is never
# read as "no runs": the gate is met by a BuildSuccessful for the request's current merged sha
# and by nothing else, so the probe can only ever narrow it (2026-09-04 — the settle window that
# used to pass an unvouched fold vacuously is GONE, with the qits.projects.release-requests.settle
# key that configured it; a repository whose pipeline never materializes now stays PENDING, which is
# the point). POST /ci/api/runs/cancellations {repoId, releaseRequestId} asks for a superseded
# request's in-flight runs to be stopped when a re-fold supersedes the sha they were started for.
#
# THE CANCELLATION IS BEST EFFORT AND MUST STAY THAT WAY. The gate is correlated by merged sha — a
# verdict for a fold the request has moved past matches nothing and settles nothing — so the
# cancellation frees a build agent and decides nothing. Unset, unreachable, refused and answered 404
# by a qits-ci that has not shipped the route are one behaviour: a debug line, and the release flow
# carries on. It is scoped to ONE request and there is deliberately no repository-wide spelling: a
# sibling request folds its own sources and its runs are none of this one's business.
#
# A THIRD READ ON THE SAME ADDRESS, and it decides whether a released tag is publish-gated at all.
# GET /ci/api/repositories/{repoId}/release-phase?rev=refs/tags/<version> answers {declared} — does
# qits-ci run a release for that tag. It is asked once per gate evaluation of a released tag whose
# tree carries .config/qits/release.yml, and never for one that declares none — a tag cut before the
# migration carries a hand-written ci-event-release.yml recipe instead, and since those files stopped
# being read (2026-09-18) it simply is not publish-gated. The question CANNOT be answered here: the archetype the file
# names lives at the WRAPPER repository's main, and the repository's own file may override the
# release: slot wholesale, so only the composer knows. Reading "names an archetype" as "publishes"
# was the 2026-09-16 defect — the spa-frontend and cli archetypes declare no release: slot, so every
# SPA release stamped a publish gate no run would ever answer and its main never moved again.
#
# UNSET IS "COULD NOT ASK" AND NEVER "NO RELEASE RUN", which is a stronger rule than the active
# listing's above: there a missing answer only fails to narrow a gate, here it would wave a release
# onto main with its publish unchecked, and main cannot be taken back. So unset, unreachable, 503
# (the far side's own "ask again later") and an unreadable body are one behaviour — the released tag
# stays UNGATED and the 30s sweep asks again. On a tier with no qits-ci configured, a migrated
# repository's tag therefore waits rather than merging; that is the intended posture and the reason
# this key is worth setting on every tier that releases.
#
# The credential is the `ci` named OIDC client below (audience qits-ci); with it disabled all three
# hops fall back to the forwarded X-Qits-* pair, which is the posture these can afford and the git
# host's primitives cannot.
#qits.projects.release-requests.ci-url=
#
# HOW LONG A PENDING PUBLISH GATE IS ORDINARY, before anybody is told about it. A released tag whose
# release run never reports holds main for ever, correctly — there is deliberately NO timeout that
# passes a gate, because a publish that is merely slow must keep main waiting and a release whose
# artifacts were never published must never reach main. What this key buys is AUDIBILITY: past the
# window the sweep writes the waiting time onto the row's publish_detail (so it surfaces on
# GET /projects/api/repositories/{repoId}/release-requests, where the person who can act on it is
# already looking) and logs one WARN naming the repository, the tag and how long it has waited.
#
# IT SAYS IT ONCE PER WINDOW, NOT ONCE PER SWEEP. The waited time is quantized down to a multiple of
# this value and the sentence is only spoken when it CHANGED, so the shipped hour is at most one WARN
# per hour per stuck release — the same say-it-when-it-changes rule a merge that will not apply
# already follows. Shorten it on a tier where a release run is expected in minutes; a zero or
# negative value switches the signal off and changes nothing else.
qits.projects.release-requests.publish-gate-patience=PT1H
#
# qits-deployments, and THE THIRD PHASE OF A RELEASE PIPELINE — one read and one ask, on one address.
# A release is one pipeline of three phases: QA (a qits-ci run at the fold), publish (a qits-ci run at
# the tag) and deploy (a qits-deployments deployment request for the released version). The first two
# are rows in this database, mirrored off the bus; the third is a fact only qits-deployments holds, so
# it is read live.
#
# GET /platform-deployments/api/deployment-requests?repoId=…&version=… answers that repository's
# requests for that version, newest first, and the newest one's deploymentStatus IS the phase's state.
# POST /platform-deployments/api/events/software-released {repoId, version, …} is the rerun of that
# phase — the same intake the release itself posts, which is the door a redeploy has always gone
# through and the only one qits-deployments has ever had: it names "an operator redeploys a version"
# as one of the two things it exists for and is deliberately exempt from the monotonic version
# collapse, so a re-post is honoured rather than swallowed. Nothing was retired to add this.
#
# NOTHING FUNCTIONAL HANGS OFF THE READ. The DEPLOYMENT gate is still closed by a DeploymentActive
# reaching ReleaseFinalization and by nothing else; this key decides whether a person can SEE the
# phase that gate is waiting on. A phase and the gate behind it are two facts and neither is derived
# from the other.
#
# UNSET SHIPPED, and unset is "could not be asked" — which is drawn as a deployment phase in state
# UNKNOWN and NEVER as "this release deploys nothing". Unset, unreachable, refused, any non-200 and an
# unreadable body are one behaviour; a 200 carrying an empty array is a different answer entirely
# (qits-deployments really was asked and really has nothing for this version yet) and reads as
# PENDING. A repository that declares no .config/qits/deployments.yml at main is a third thing again:
# its pipeline has TWO phases and the third is not drawn at all, which ReleaseGates' existing
# "configured" / "unknown" split already answers without a second read.
#
# THE READ IS ON THE SINGLE-REQUEST PATH ONLY. That listing is keyed on the (repoId, version) PAIR and
# refuses a question naming only a repository, so a page of N released requests would be N HTTP calls
# with nothing to batch — on the project-wide worklist, the busiest read this service has. So the list
# reads omit the deploy phase (absent, not unknown) and the request a person has opened asks once.
#
# THE TWO DOORS WANT TWO DIFFERENT CALLERS, and getting that wrong is a silent 403. The listing is
# qits:admin / qits:agent — a person's role and an agent's — so the read presents the forwarded
# X-Qits-* pair as qits:agent and DELIBERATELY NO MACHINE BEARER: a platform service client carries
# qits:system and its own clients/<id> and nothing else (qits-idp's ClientRegistry, fixed in code), so
# a bearer here would be a guaranteed 403 that this port would faithfully report as a permanent
# UNKNOWN. The intake is the opposite — qits:system plus a machine-auth check — so the ask presents
# the `qits` named OIDC client's bearer and falls back to the forwarded pair only where that client
# is disabled, which is the same topology in which the far side's machine gate is off.
#qits.projects.release-requests.deployments-url=
#
# THE RERUN OF THE OTHER TWO PHASES IS ON THE ci-url ABOVE. POST /ci/api/runs/rerun
# {repoId, releaseRequestId, phase} with RELEASE_REQUEST (QA) or RELEASE (publish), answering
# {runId}. It is the fourth hop on that address and the first that is a person's button, so unlike
# its three neighbours it THROWS rather than degrading: unset is a 503 at the door. qits-ci's own 409
# reaches the caller WITH ITS MESSAGE INTACT — that the phase's newest run succeeded and its verdict
# was spent on cutting the tag, that the phase has never run, that it is running right now — because
# that sentence is a fact about this release the person pressing the button has not got, and
# "could not re-run that phase" would be strictly less than what was already known.
#
# qits-maintenance, and ONE READ that enriches an announcement. At every fold that produced a new
# sha, GET /maintenance/api/repositories/{repoId}/downstream is asked what is built on top of this
# repository — the closure of its dependents, traced to the end from the SBOM graph and the declared
# pins — and the answer rides on ReleaseRequestChanged as downstreamTechnicalComponents, ordered
# nearest-first. Its one reader is qits-ci's queue ordering: with a library's request and its
# consumer's request both queued, the library's runs first. The path is addressed by this service's
# OWN repository row id, which is qits-maintenance's catalogId.
#
# UNSET SHIPPED, and unset is one of FOUR SPELLINGS OF THE SAME BEHAVIOUR. Unset, unreachable,
# refused, and answered 404 by a qits-maintenance that has not shipped the route: one WARN, no
# downstreamTechnicalComponents key on the event, and qits-ci reads an absent key as "unknown" and
# orders exactly as it does today. There is nothing to fail here — the enrichment is advisory and the
# fold has already landed by the time it is asked. AN EMPTY ANSWER IS NOT THAT: a 200 carrying an
# empty array means the repository is a leaf and travels as [], which is real information.
#
# It never delays an announce beyond one GET capped at 3 seconds (2s to connect), asked once per
# fold and never cached — announces only fire when a fold actually moved a sha.
#
# The credential is the `maintenance` named OIDC client above (audience qits-platform-maintenance);
# with it disabled the hop falls back to the forwarded X-Qits-* pair, which this door can afford
# because it is a read.
#qits.projects.release-requests.maintenance-url=
#
# qits-workspaces, and ONE lifecycle call that is not part of the release. THE KEY RETIRED WITH THE
# RELEASE DOOR ON 2026-09-03 AND RETURNS WITH A NARROWER JOB: it used to address a door that merged
# into main, pushed, tagged and promoted, and that door is gone for good. What it addresses now is
# POST /workspaces/api/branches/resolution?repositoryId=…, made AFTER a release has already landed,
# saying that a branch the release consumed was deleted on the git host. Never a release verb; do not
# route one back through it.
#
# The call exists because of an ABSENCE. The release deletes each consumed branch through a
# qits-githost primitive that writes the ref in core and fires NO event, so nothing else in the
# platform can ever tell qits-workspaces that the branch under one of its workspaces died — and the
# workspace stays ACTIVE for ever holding a container, a volume and a commissioned credential
# (measured live 2026-09-05 on the storage-creep wrapper workspace).
#
# SET SHIPPED, unlike the two above, because it is not a switch for the flow: a release does not
# depend on the answer and cannot be failed by it, so a sensible in-network default costs nothing and
# an unset one would only lose reaps. The deployed platform overrides it with
# QITS_PROJECTS_RELEASE_REQUESTS_WORKSPACES_URL. Blank switches the call off explicitly; the
# credential is the `workspaces` named OIDC client above, and with that disabled the call is not made
# at all — no header fallback, because the far side destroys a container.
qits.projects.release-requests.workspaces-url=http://qits-workspaces:8080
#
# THE SAME SERVICE UNDER ITS OWN NAME. A ticket's "Assign agent" door
# (POST /projects/api/tickets/{id}/dispatch-agent -> POST /workspaces/api/agent-dispatches) is a
# second reason to know where qits-workspaces is, and it has nothing to do with release requests —
# so it reads THIS key and not the one above, whose name says release-requests and whose whole
# documented job is one lifecycle call made after a release.
#
# SHIPPED UNSET, and that is the point of it: workspacehost/HttpWorkspaceAgentDispatch falls back to
# the release-requests key when this one is unset or blank, so a platform that has already configured
# qits-workspaces once (QITS_PROJECTS_RELEASE_REQUESTS_WORKSPACES_URL) has configured the dispatch
# door too and nothing had to be redeployed. One value to set today; a correct name to move to, and
# when every environment names it the old key narrows back to the release path it is named for.
# Neither set is a 503 at the door — a platform with no workspaces context cannot dispatch an agent,
# and the credential is the `workspaces` named OIDC client above, whose absence is a 503 as well.
#
# The SECOND reader of this pair is workspacehost/HttpWorkspaceAgentTurns, which says something to
# the agent already standing on a branch (POST /workspaces/api/agent-dispatches/delivery) after a
# ticket phase transition has already been recorded. Same two keys, same order, no third address —
# but the OPPOSITE failure contract: nobody is waiting on that call, so an unset address, a missing
# credential and an unreachable far side are one WARN and a hand-off that did not happen, never a
# status code on a door.
#qits.projects.workspaces-url=
# The sweep is the safety net under the event-driven path; off in dev and test the way the bus is
# dark — a tick landing mid-test would execute a request the test was still staging.
qits.projects.release-requests.sweep-every=30s
%dev.qits.projects.release-requests.sweep-every=off
%test.qits.projects.release-requests.sweep-every=off

# WHO IS NOT WATCHING. A release request carries the forwarded identity of whoever asked for it;
# qits-maintenance deliberately sends none, so its nightly bumps are attributed to its own machine
# principal and every one of them is a request with no reader at the end of it. A red gate on one of
# those was seen by nobody at all until 2026-09-10 (qits-deployments-platform-service: REJECTED at
# 07:14, still unnoticed at 11:00), which is what UnattendedGateTickets now files a BUG ticket for.
#
# This names the machine identities, comma-separated and matched exactly. It is not a switch for
# turning the reporting off — leaving the port unimplemented is — and a requester that is NULL is
# deliberately not in it: unattributed is a different fact from machine-asked.
qits.projects.release-requests.unattended-requesters=qits-platform-maintenance
