archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-projects, sbom: .sbom/sbom.json }
  # The committed OpenAPI document, published as `@apidocs/qits-projects` on every release by the
  # composed postlude (OpenApiSchemaExportTest keeps it current).
  - { type: docs, name: "@apidocs/qits-projects", path: docs/openapi.yml }
# The provider golden masters (epic qits-546): the platform packages `golden-masters/` as
# `eu.wohlben.qits:qits-projects-golden-masters` and `@qits/projects-golden-masters`, each published
# only when its content changed, plus the `@contracts/qits-projects` docs bundle.
contracts:
  application: qits-projects
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  # THIS SERVICE'S OWN CONSUMER PACTS (ticket qits-1149): what it asks the services it calls,
  # written by service/src/test/.../contracts/consumer/ConsumerPactFilesTest from each provider's
  # golden masters and committed at pacts/qits-projects-service_<provider>.json. The platform packs
  # each as `eu.wohlben.qits:qits-projects-service-pacts-<provider>`, only when it changed, for the
  # provider to pin and verify. A provider appears here once at least one row against it is
  # recorded; ConsumerPactFilesTest holds this list equal to the committed files.
  pacts:
    qits-events-service: { packages: [maven] }
    qits-githost-service: { packages: [maven] }
    qits-maintenance-service: { packages: [maven] }
    qits-workspaces-service: { packages: [maven] }
userflows: qits-projects
