archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-projects, sbom: .sbom/sbom.json }
  # THE PROVIDER GOLDEN MASTERS AS A JAR (epic qits-546), published ONLY when the tree changed — so
  # `announce: if-published`: qits-ci asks qits-artifacts for the .pom at the release version before
  # it announces, and a release that published nothing announces nothing. No `sbom:` — the jar has
  # no dependencies, and the postlude runs in the builder step, where this jar does not exist.
  - { type: maven, name: "eu.wohlben.qits:qits-projects-golden-masters", announce: if-published }
  # THE SAME TREE AS AN NPM PACKAGE (qits-574), under the SAME decision as the jar — both at the
  # release version or neither (`.config/qits/golden-masters.sh decide`), so a consumer's maven and
  # npm coordinates never name two versions of one tree. `announce: if-published` for the same
  # reason as the jar's. No `sbom:` — no dependencies, and no build step produces one.
  - { type: npm, name: "@qits/projects-golden-masters", announce: if-published }
  # THE TWO DOCS SITES, published on every release. No `sbom:` on either: a bundle of documents has no
  # bill of materials. Both are submitted by the second release step below.
  - { type: docs, name: "@apidocs/qits-projects" }
  - { type: docs, name: "@contracts/qits-projects" }
userflows: qits-projects

# THE RELEASE SLOT IS OVERRIDDEN because java-service pushes one image and publishes nothing else,
# and this release also publishes a jar, an npm package and two docs sites. The QA slot is NOT
# overridden: the archetype's `release-request:` (with `-Dit.test` composed from
# `.config/qits/userflow-stories`) is exactly what this repository needs.
#
# STEP ONE IS THE ARCHETYPE'S RELEASE STEP, VERBATIM — copied from qits-ci-service's packaged
# `.config/qits/release-archetypes/java-service.yml` (at ae82936), comments and guards included: the
# image (whose native build, `-Dquarkus.native.native-image-xmx=6g` included, is docker/Dockerfile's
# business and untouched), the webui submodule and its bundle, and the SBOM the composed postlude
# submits from this step (the last one with `build: true`). Keep it byte-identical to the archetype's
# QA build: the builder cache is content-addressed, so a release after a green fold is cache hits.
# When the archetype's step changes, re-copy it here.
#
# STEP TWO IS EVERYTHING ELSE, on maven-base because it needs maven + a JDK and the builder image
# has neither (node-docker-base is node + buildctl). It also publishes the npm package, without npm:
# see the npm half at its end for why that is a hand-built tarball rather than a third step. The qits CLI is fetched into every release step
# by the composed prelude, so the docs submits run here too. It runs after the image is pushed.
release:
  # The same image and the same build as the QA half, plus the two exports. The composer has already
  # fetched the release tag and detached at it before this script runs.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # THE COORDINATE, OUT OF THE DECLARATION THAT ANNOUNCES IT. See the header for why this is
      # read rather than derived, and why the spelling is one line of flow YAML.
      declared=$(sed -n \
        's/^[[:space:]]*-[[:space:]]*{[[:space:]]*type:[[:space:]]*docker[[:space:]]*,[[:space:]]*name:[[:space:]]*\([^,}[:space:]]*\).*/\1/p' \
        .config/qits/release.yml)
      count=$(printf '%s' "$declared" | grep -c . || true)
      if [ "$count" != 1 ]; then
        echo "release.yml declares $count docker artifacts and java-service pushes exactly one." >&2
        echo "Spell it as one flow line — '- { type: docker, name: qits/x, sbom: .sbom/sbom.json }'" >&2
        echo "— or declare this repository's own 'release:' steps." >&2
        exit 1
      fi
      case "$declared" in
        *[!A-Za-z0-9._:/@+-]*)
          echo "release.yml's docker artifact name is not a coordinate: $declared" >&2
          exit 1 ;;
      esac
      # The first segment is the platform namespace and is re-supplied from the environment, which
      # is how every hand-written file spelled it: a deployment may re-point the namespace and the
      # declaration may not have to move.
      image=${declared#*/}
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/$image:$QITS_VERSION"
      echo "releasing $ref"

      # --- half one: the bundle -------------------------------------------------------------------
      # Byte-identical to the QA step's, deliberately. `checkout --detach` on the tag is what makes
      # the submodule update land on the gitlink the RELEASE recorded rather than on main's.
      origin_parent="${QITS_CI_REPOSITORY_URL%/*}"
      webui_dirs=""
      if [ -f .gitmodules ]; then
        for key in $(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$'); do
          name=${key#submodule.}
          name=${name%.path}
          path=$(git config -f .gitmodules --get "$key")
          git -c "submodule.$name.url=$origin_parent/$name" submodule update --init "$path"
          if [ -f "$path/package.json" ]; then
            webui_dirs="$webui_dirs $path"
          fi
        done
      fi

      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      for dir in $webui_dirs; do
        (
          cd "$dir"
          if [ -f package-lock.json ]; then
            sed -i -E \
              -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
              -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
              package-lock.json
          fi
          env npm_config_registry="$QITS_NPM_PROXY_URL" \
              "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
              npm ci --no-audit --no-fund
          npm run build
        )
      done

      # --- half two: the image --------------------------------------------------------------------
      # `push=true` IS THE PUBLISH: the image goes from the builder straight to the registry and
      # never enters any local image store. $QITS_BUILD_REGISTRY is the registry as the BUILDER
      # resolves it; $QITS_REGISTRY stays the host daemon's view and is not dialled here.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM, GENERATED HERE AND SUBMITTED BY THE PLATFORM ---------------------------------
      # The second build reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding the
      # service module's CycloneDX document, exported with `type=local` instead of pushed. Build
      # args and secrets are byte-identical to the image build above, which is what makes every
      # layer a cache hit in the same builder and this export seconds rather than a second native
      # compile.
      #
      # NOTHING SUBMITS IT HERE. The composed postlude runs `qits-publish sbom submit` for every
      # declared artifact carrying `sbom:`, after this script and before the step's exit code — so
      # "SBOM before green" holds by construction. Declare `sbom: .sbom/sbom.json` and stop.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom

  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"

      # --- the docs, on every release ----------------------------------------------------------
      # `@apidocs`: the committed OpenAPI document (OpenApiSchemaExportTest keeps it current) as the
      # bundle's root, qits-ci-service's shape. `@contracts`: the golden-master tree UNDER
      # `golden-masters/`, which is where qits-docs' contracts renderer reads `golden-masters/index.json`.
      # Both idempotent: the CLI treats the store's "already there" as published, so a re-run is safe.
      tar -czf /tmp/apidocs.tgz -C docs openapi.yml
      qits artifacts publish docs submit \
        --site "@apidocs/qits-projects" --version "$QITS_VERSION" --archive /tmp/apidocs.tgz \
        --meta git.commit.hash="$QITS_CI_SHA" \
        --meta git.repository.name=qits-projects
      tar -czf /tmp/contracts.tgz golden-masters
      qits artifacts publish docs submit \
        --site "@contracts/qits-projects" --version "$QITS_VERSION" --archive /tmp/contracts.tgz \
        --meta git.commit.hash="$QITS_CI_SHA" \
        --meta git.repository.name=qits-projects

      # --- the golden masters, jar AND npm package, under ONE decision ------------------------
      # `decide` is taken once for both artifacts (read .config/qits/golden-masters.sh's header):
      # `publish` when the jar's change gate says first/changed, when @qits/projects-golden-masters
      # does not exist yet (the first npm publish happens even with the jar unchanged — the jar then
      # gets a new, identical version, which keeps the two aligned), or when either already carries
      # $QITS_VERSION (a re-run completing a half-landed publish). Otherwise `skip`, for both. THE
      # GATE COMPARES AGAINST THE NEWEST PUBLISHED JAR, not the previous tag, and every registry
      # error fails the step — an error is never read as "unchanged" or "absent".
      coordinate="eu.wohlben.qits:qits-projects-golden-masters"
      decision=$(sh .config/qits/golden-masters.sh decide)
      case "$decision" in
        "publish "*) echo "publishing the golden masters (jar + npm) at $QITS_VERSION: ${decision#publish }" ;;
        "skip "*)
          echo "the golden masters: ${decision#skip } — publishing neither at $QITS_VERSION"
          exit 0 ;;
        *) echo "the golden-masters gate answered '$decision'" >&2; exit 1 ;;
      esac

      # THE DEPLOY CREDENTIAL, maven-library.yml's mechanism verbatim (read its comments): a bearer
      # minted at the call site into a `-gs` settings file of this recipe's OWN path (never the
      # platform's /tmp/qits-deploy-settings.xml), the http blocker re-declared, anonymous when no
      # mint is possible. `printf`, not a heredoc, because this is a YAML block scalar.
      deploy_settings=""
      deploy_token=""
      if [ -n "${QITS_PUBLISH_TOKEN_COMMAND:-}" ] \
        && command -v "$QITS_PUBLISH_TOKEN_COMMAND" >/dev/null 2>&1; then
        deploy_token=$("$QITS_PUBLISH_TOKEN_COMMAND" 2>/dev/null) || deploy_token=""
      fi
      if [ -n "$deploy_token" ]; then
        ( umask 077
          printf '%s\n' \
            '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">' \
            '  <servers>' \
            '    <server>' \
            '      <id>qits</id>' \
            '      <configuration>' \
            '        <httpHeaders>' \
            '          <property>' \
            '            <name>Authorization</name>' \
            "            <value>Bearer $deploy_token</value>" \
            '          </property>' \
            '        </httpHeaders>' \
            '      </configuration>' \
            '    </server>' \
            '  </servers>' \
            '  <mirrors>' \
            '    <mirror>' \
            '      <id>maven-default-http-blocker</id>' \
            '      <mirrorOf>external:http:*</mirrorOf>' \
            '      <url>http://0.0.0.0/</url>' \
            '      <blocked>true</blocked>' \
            '    </mirror>' \
            '  </mirrors>' \
            '</settings>' > /tmp/qits-recipe-deploy-settings.xml )
        deploy_settings="-gs /tmp/qits-recipe-deploy-settings.xml"
      fi

      # ONLY THE GOLDEN-MASTERS MODULE, and as a standalone build: `-f` its own pom, which has no
      # parent, so no other reactor module (the service, its Quarkus extension, its BOM imports) is
      # even loaded. The release commit already moved its <version> to $QITS_VERSION.
      # A version is immutable in the store, so a re-run whose jar half already landed skips it.
      if [ "$(sh .config/qits/golden-masters.sh jar-published)" = yes ]; then
        echo "$coordinate:$QITS_VERSION is already published — not deploying it again"
      else
        ./mvnw -B -ntp -s .qits-maven-settings.xml $deploy_settings -f golden-masters-jar/pom.xml \
          deploy -DskipTests \
          -Dqits.maven.repository.url="$QITS_MAVEN_REGISTRY_URL" \
          -DaltDeploymentRepository="qits::default::$QITS_MAVEN_REGISTRY_URL"
      fi
      rm -f /tmp/qits-recipe-deploy-settings.xml

      # AND THE VERSION PUBLISHED IS THE VERSION THIS BUILD IS — maven-library.yml's check: the pom
      # at $QITS_VERSION must now answer, or `announce: if-published` would skip a release whose jar
      # went to some other coordinate, in silence.
      set --
      if [ -n "${QITS_TOKEN:-}" ]; then
        set -- -H "Authorization: Bearer $QITS_TOKEN"
      fi
      pom="${QITS_MAVEN_REGISTRY_URL%/}/eu/wohlben/qits/qits-projects-golden-masters/$QITS_VERSION/qits-projects-golden-masters-$QITS_VERSION.pom"
      if ! curl -fsS -o /dev/null "$@" "$pom"; then
        echo "the deploy did not leave $coordinate at $QITS_VERSION: $pom" >&2
        exit 1
      fi
      echo "published $coordinate:$QITS_VERSION"

      # THE NPM HALF, HAND-PACKED AND PUT, because this image has no node/npm (maven-base: maven, a
      # JDK, bash/curl/git/jq) and release steps share no filesystem — a node step could not be
      # handed this decision, and recomputing it after the jar deployed would read `unchanged`. The
      # script builds the tarball npm would (package/package.json with version = $QITS_VERSION and
      # files: ["golden-masters/"], the tree under package/golden-masters/), PUTs npm's publish
      # document to $QITS_NPM_REGISTRY_URL with a bearer minted from $QITS_PUBLISH_TOKEN_COMMAND
      # (npm-library.yml's credential), skips a version already there, and asserts it is there after.
      sh .config/qits/golden-masters.sh npm-publish
