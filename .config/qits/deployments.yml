# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# `routes` is the path prefix the edge sends here — on EVERY vhost, so /projects/api reaches this
# service from any application's host. `host` is the DNS label of this service's OWN vhost,
# projects.<env>.<domain>, where the SPA is served at `/`. It is spelled rather than derived only
# because the derivation (application name minus qits-/qits-platform-) already answers `projects`
# and this is the landing service — the edge sends `/` on the environment host here, so the label
# is worth stating out loud.
#
# `navigation-entries` places this application in the shared sidebar: `<slot>.<Label>:<position>`,
# comma separated. `system.Overview:1` puts it first in the global group, which is what replaced
# the synthesized Home link. It supersedes the old flat `navigation: Projects:4` — that key still
# parses, and naming both is an error.
#
# CARRYING THE FILE AT ALL is the other thing it says, and this service is the one that reads it:
# `ReleaseFinalization` asks the tag for this path to decide whether the repository deploys — a
# library or an SPA carries none, so its release finalizes `main` there and then, while a deployable
# one waits for the deployment to succeed. What deploys is the VERSION COORDINATE the release build
# published. `deploy_branches` used to name a branch to deploy from here, in thirteen copies of one
# platform-wide answer, and it went with the entry-branch promotion and the release door.
#
# WHAT THIS REPOSITORY DEPLOYS AS, held still across the repository rename. The repository is
# qits-projects-service now; the application is still qits-projects, so nothing that is running
# moves: the swarm service and its wire alias, the container, the image qits/qits-projects the build
# pushes, the provisioned database, the derived host label, the extras family and the
# QITS_APPLICATION the container boots with all keep the names they have. Omitted, this name would
# be DERIVED from the repository, and the rename would read as a decommission plus a new application
# rather than a rename. Changing the value later is exactly that decommission, so it does not change
# again.
application: qits-projects

routes: /projects
host: projects
# FOUR KINDS OF PLACEMENT, and two of them claim `project.detail` — one application, two rows under
# one heading, which is what makes this file a user of the lifted claim rule below.
#
# `system.Overview:1` is the environment's own door, first in the global group.
#
# `project.detail.Work:1=work` is the project's work, at `/<project>/work` — the epics and the
# tickets on one desk — and it is FIRST under the Project node because the work is what a project
# mostly is; everything else under that node is a way of working on it. It was two rows until
# qits-399, `Epics:1=epics` and `Tickets:2=tickets`, a board and the bugs and improvements too small
# to put on it; the SPA drew them as two pages over two collections. Since qits-frontend 072512f
# (qits-397) both archetypes are one list with one detail route, `/<project>/epics` and
# `/<project>/tickets` redirect to `/<project>/work`, and two rows would be two names for one page.
# (The board used to BE the bare project address, with no row at all; it moved one segment down and
# the project address became a hub, and a row is how the work has a name in the chrome.)
#
# `project.detail.Release Requests:5=release-requests` is the whole project's open requests, at
# `/<project>/release-requests`. The per-repository rows below answer "why has this repository not
# landed"; this one answers "what is waiting anywhere in the project", which is a question you
# cannot ask a repository-shaped sidebar without opening every repository in turn.
#
# THE SECOND CLAIM ON ONE SLOT IS THE POINT, and it was refused until 2026-08-31: the deployer's
# DeploymentSpecParser, the edge's EdgeRoutes and the `edge_navigation_entry` primary key all
# admitted one entry per slot per application, so a file shaped like this one made the WHOLE spec
# unreadable and the deployment failed while CI stayed green. All three key the claim on the
# `(slot, label)` pair now — a slot is a heading the shell draws, not a seat one application
# occupies — and the ui-components shell renders two same-application rows correctly since
# 2026.831.134647 (row keys carry the label). What is still refused is the same label twice in one
# slot, which is one row asked for twice.
#
# BOTH PROJECT ROWS ARE REGISTRY ENTRIES rather than something the SPA declares, and that is not a
# preference. The Project node's children are drawn by the shared chrome
# (`QitsMainLayout.projectRows`): it renders "Project setup" itself and then appends whatever the
# platform announces on the `project.detail` slot. An application has no other way to put a row
# there, and an ordering stated against the rows qits-workspaces already publishes is expressible
# only in that slot's own integers.
#
# THE PROJECT GROUP READS Work 1, Workspaces 3, Editor 4, Release Requests 5 — WITH A GAP AT 2, and
# the gap is deliberate. It read Epics 1, Tickets 2, Workspaces 3, Editor 4, Release Requests 5 until
# qits-399 folded the first two into Work, which kept Epics' 1 and left Tickets' 2 empty. The edge
# sorts by position and only the ORDER of the integers is ever drawn, so an empty 2 renders exactly
# as a dense list would: Work, Workspaces, Editor, Release Requests.
#
# Closing it was the alternative and it was refused. It is a cross-repository renumber — this file's
# Release Requests 5 -> 4 and qits-workspaces' pair 3,4 -> 2,3 — whose two halves cannot land in one
# commit, so it buys a window of TIES (Workspaces and Release Requests both at 4, or Workspaces and
# Editor both at 3) to reach a state that looks the same as today's. A tie still renders, by label
# and then by application, but that is the order becoming an accident of the LABEL, which is what
# the renumber below exists to avoid; a gap is never that. Deliberate integers and no ties — gaps are
# allowed, and the next row that belongs between Work and Workspaces takes the 2 without moving
# anybody. (5 is shared with another application's `project.detail` row today — a tie this change
# neither made nor resolves; the renumber rule below says how to close it when it matters.)
#
# THIS SPA'S OWN HUB PAGE DOES NOT DRAW THEM TWICE. `ProjectPage` composes a card per
# `project.detail` entry and drops the entries whose `app` is this application: Work and Release
# requests are `routerLink`s it declares itself, so drawing them from the registry as well would put
# one destination on the page twice — once as a router hop and once as a full page load of this very
# host. The drop is by application, not by label, so it covers every entry this file declares
# whatever it is called.
#
# `<category>.details.Release Requests:3=release-requests` is the per-repository row, and it opens
# this SPA's `/<project>/<group>/<repo>/release-requests` — the repository's release requests, which
# is the asynchronous gated ask that replaced calling the release door blind. It is declared on
# every one of the seven archetype slots because every kind of repository is released: a library, an
# SPA, a standalone app and an OCI image each go through the same request, so a row that hung under
# services alone would be missing exactly where a person most often has to ask why nothing landed.
#
# POSITION 3 IS A RENUMBER, not a free slot. The detail group ran Docs 2, Code 3, CI 4, Artifacts 5,
# Configuration 6, Workspaces 7; this row goes above Code, so qits-githost, qits-ci, qits-artifacts,
# qits-configuration and qits-workspaces each moved up one in the same change. The alternative was to
# share position 2 with Docs and let the tie-break do the ordering — the edge sorts by position, then
# label, then application, and "Docs" < "Release Requests" — but that makes the order an accident of
# the *label*, so renaming this row to "Releases" would silently move it above Docs. Integers that
# say what they mean are worth five one-line commits.
#
# The per-repository row and the project one share a LABEL and not a slot, which is exactly what the
# pair-shaped claim permits: eight entries spell "Release Requests" and no two of them are in one
# slot.
#
# The `services.details.Api Docs` entry this file used to carry is still gone and is not coming
# back: API documentation is a sub-item of Docs now (the docs app renders it from published @apidocs
# bundles). This application's viewer route (`/<project>/services/<repo>/api-docs`, the live
# swagger-ui frame) still answers; it is just not a sidebar row.
navigation-entries: system.Overview:1, system.Agent Configuration:6=agent-configuration, project.detail.Work:1=work, project.detail.Release Requests:5=release-requests, services.details.Release Requests:3=release-requests, daemons.details.Release Requests:3=release-requests, libs.details.Release Requests:3=release-requests, apps.details.Release Requests:3=release-requests, frontends.details.Release Requests:3=release-requests, cli.details.Release Requests:3=release-requests, images.details.Release Requests:3=release-requests

# THREE DATABASES, because this application opens three datasources with three Flyway lineages:
# `projects` (domain/), `epics` (entities/) and `eventstream` (the qits-eventstream jar's outbox and
# durable-claim tables). qits-platform-deployments creates a login role and a database for each on
# the postgres of this tier before the container starts, and injects
# QITS_RESOURCE_<NAME>_URL / _USERNAME / _PASSWORD — the generic contract the three library jars map
# onto quarkus.datasource.* in their own shipped defaults.
#
# `db` takes the DERIVED default database, qits_projects: `qits_` plus the application name without
# its qits- prefix, dashes to underscores. `epics` and `eventstream` NAME their databases, and have
# to: the default is derived from the application, so all three entries would have asked for
# qits_projects.
#
# THE EVENTSTREAM ENTRY IS NOT OPTIONAL AND ITS NAME IS LOAD-BEARING. This service consumes the git
# host's SCM events durably (bus/ScmBackupTriggerListener), which is what replaced the post-receive
# HTTP call its backup trigger used to arrive on. The jar reads QITS_RESOURCE_EVENTSTREAM_*, so the
# resource name here is what makes those variables exist; rename it and the expression is
# unresolvable and the process refuses to boot at Flyway. Being dark (`qits.eventstream.enabled`)
# would not save it — dark stops publishing, sweeping and dialling, never the datasource.
#
# idp:client ASKS QITS-DEPLOYMENTS TO PROVISION THIS APPLICATION'S OWN QITS-IDP SERVICE CLIENT — id
# `dev-qits-projects` (derived from env + application), roles `qits:system`, fixed in qits-idp code.
# The deployer stores the secret the way it stores a database password, and injects
# QITS_RESOURCE_IDP_URL, QITS_RESOURCE_IDP_CLIENT_ID and QITS_RESOURCE_IDP_CLIENT_SECRET, which the
# `qits` oidc client reads before its old fallback keys.
#
# Ticket qits-162, epic qits-540 contract C3.
resources: postgresql:db, postgresql:epics:qits_epics, postgresql:eventstream:qits_projects_eventstream, idp:client

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /projects/q/swagger-ui
